<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Not TPG">
<meta name="description" content="Prochains départs tpg, itinéraires et trajets pendulaires">
<title>Not TPG</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root{
    --ground:#F4F3EF; --card:#FFFFFF; --ink:#15171C; --muted:#5E6470; --faint:#8A8F98;
    --line:#E4E2DC; --line2:#EFEDE8; --accent:#C2410C; --ok:#15803D; --late:#B45309; --bad:#B91C1C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--ground);color:var(--ink);overscroll-behavior:none}
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit;color:var(--ink)}
  #app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
  #main{flex:1;display:flex;flex-direction:column;min-height:0}
  .scroll{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
  .stack{display:flex;flex-direction:column;gap:14px}
  .top{padding:calc(env(safe-area-inset-top) + 18px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .top.back{padding-left:8px;justify-content:flex-start;gap:4px}
  .brand{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em}
  .brand.sm{font-size:28px}
  .title{margin:0;font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .list{overflow:hidden}
  .label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .label.sm{font-size:11px}
  .muted{color:var(--muted)} .sm{font-size:13px}
  .muted-strong{font-size:14px;font-weight:700;color:var(--muted)}
  .field{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 6px 0 14px}
  .field.bb{border-bottom:1px solid var(--line2)}
  .field input{flex:1;border:0;outline:none;background:transparent;font-size:17px;font-weight:700;min-width:0;padding:0}
  .field input::placeholder{color:var(--faint);font-weight:600}
  .fl{display:flex;flex-direction:column;flex:1;min-width:0}
  .icon-btn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:12px}
  .icon-btn:active{background:var(--line2)}
  .danger{color:var(--bad)!important}
  .primary{height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:16px}
  .primary:active{filter:brightness(.92)}
  .w100{width:100%}
  .ghost{height:40px;padding:0 14px;border:1.5px solid #D6D3CC;border-radius:12px;background:#fff;font-weight:700;font-size:14px}
  .link{background:none;border:0;color:var(--accent);font-weight:800;font-size:14px;min-height:44px;padding:0 4px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 6px}
  .row-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 12px 0 16px;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;font-size:17px;font-weight:700}
  .row-actions{display:flex}
  .sugg{display:flex;flex-direction:column}
  .sugg-item{min-height:48px;padding:0 16px;text-align:left;background:#FAF9F6;border:0;border-top:1px solid var(--line2);font-weight:600;font-size:15px}
  .foot{margin:12px 4px 0;font-size:12px;color:var(--muted)}
  .empty{margin:0;padding:20px 16px;color:var(--muted)}
  .empty-card{padding:24px 18px;text-align:center;color:var(--muted)}
  .badge{min-width:42px;height:30px;padding:0 8px;border-radius:8px;color:#fff;font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .badge-sm{min-width:30px;height:22px;padding:0 6px;border-radius:6px;color:#fff;font-weight:900;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .controls{padding:2px 16px 12px;display:flex;flex-direction:column;gap:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{height:36px;min-width:44px;padding:0 14px;border-radius:18px;border:1.5px solid #D6D3CC;background:#fff;font-weight:900;font-size:15px}
  .chip.on-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .from-row{display:flex;align-items:center;gap:8px}
  .time-in{height:44px;border:1.5px solid #D6D3CC;border-radius:12px;padding:0 10px;background:#fff;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .dep{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--line2)}
  .dep-to{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .to{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dep-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .big{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
  .st-ok{font-size:13px;font-weight:800;color:var(--ok)}
  .st-late{font-size:13px;font-weight:800;color:var(--late)}
  .st-gone{font-size:13px;font-weight:800;color:var(--bad)}
  .conn{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .conn-top{display:flex;align-items:baseline;justify-content:space-between}
  .big2{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .dash{color:var(--faint);font-weight:700}
  .conn-legs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ml{margin-left:auto}
  .cm{padding:16px;display:flex;flex-direction:column;gap:12px}
  .cm-title{font-size:18px;font-weight:900}
  .cm-list{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
  .cm-row,.cand{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid var(--line2)}
  .cand{padding:0 16px;cursor:pointer}
  .cand input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
  .cm-time{font-size:17px;font-weight:800;width:112px;flex:none;font-variant-numeric:tabular-nums}
  .cm-legs{flex:1;display:flex;gap:4px;flex-wrap:wrap}
  .row{display:flex;align-items:center} .gap{gap:8px} .f1{flex:1;min-width:0}
  .days{display:flex;justify-content:space-between;margin-top:8px}
  .day{width:42px;height:42px;border-radius:21px;border:1.5px solid #D6D3CC;background:#fff;font-weight:900;font-size:13px}
  .day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 8px calc(env(safe-area-inset-bottom) + 6px)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;font-size:12px;font-weight:800;min-height:56px;color:var(--muted)}
  .tab.on{color:var(--accent)}
  .next{width:100%;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
  <nav>
    <button class="tab on" id="tabHome" data-tab="home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
      Accueil
    </button>
    <button class="tab" id="tabCommutes" data-tab="commutes">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      Pendulaire
    </button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   Not TPG — données : transport.opendata.ch (sans clé)
   ========================================================= */
const API = 'https://transport.opendata.ch/v1';
const DAYS = ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'];
const DAYS_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const PALETTE = ['#1D4ED8', '#BE185D', '#0E7490', '#047857', '#374151', '#B45309', '#9F1239', '#7C2D12', '#4D7C0F', '#6D28D9', '#0F766E', '#A21CAF'];
const LOCAL_CATS = ['B', 'T', 'BN', 'NFB', 'NFT', 'M', 'BUS', 'TRAM', 'Bus', 'Tram'];

const ICON = {
  target: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  pin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  locate: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
  swap: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6470" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  up: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6470" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};

/* ---------- utilitaires ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const parseISO = (s) => (s ? new Date(s.replace(/([+-]\d\d)(\d\d)$/, '$1:$2')) : null);
const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const t2m = (t) => { const p = String(t || '0:0').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
const m2t = (m) => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const dmin = (d) => d.getHours() * 60 + d.getMinutes();
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayIdx = (d) => (d.getDay() + 6) % 7;
const short = (n) => String(n || '').replace(/^Genève,\s*/, '');

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function lineColor(cat, num) {
  if (!LOCAL_CATS.includes(cat)) return '#B91C1C'; // trains (CFF, Léman Express…)
  const k = String(num || cat); let h = 0;
  for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 997;
  return PALETTE[h % PALETTE.length];
}
function badge(cat, num, small) {
  return `<span class="${small ? 'badge-sm' : 'badge'}" style="background:${lineColor(cat, num)}">${esc(num || cat || '?')}</span>`;
}

/* ---------- état ---------- */
let favs = store.get('nt_favs', []);
let filters = store.get('nt_filters', {});
let commutes = store.get('nt_commutes', []);
const S = { screen: 'home', stop: null, fromText: '', toText: '', geo: null, editFavs: false, fromTime: '', board: [], draft: null, q: null, res: [] };
const statusCache = {};
let boardTimer = null;
const main = $('#main');

/* ---------- liaisons ---------- */
function mapConn(c) {
  const dep = parseISO(c.from.departure), arr = parseISO(c.to.arrival);
  const legs = (c.sections || []).filter((s) => s.journey).map((s) => ({ cat: s.journey.category, num: s.journey.number }));
  return {
    dep, arr, depStr: hm(dep), arrStr: hm(arr), dur: Math.round((arr - dep) / 60000),
    transfers: c.transfers || 0, legs, key: legs.map((l) => l.num || l.cat).join('+'), delay: c.from.delay || 0
  };
}
async function getConns(from, to, date, time, limit = 6) {
  const j = await api(`/connections?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&date=${date}&time=${time}&limit=${limit}`);
  return (j.connections || []).map(mapConn);
}
async function connsInWindow(from, to, date, start, end) {
  const out = []; let time = start; const s = t2m(start), e = t2m(end);
  for (let i = 0; i < 4; i++) {
    const list = await getConns(from, to, date, time, 16);
    if (!list.length) break;
    for (const c of list) {
      if (ymd(c.dep) !== date) continue;
      const m = dmin(c.dep);
      if (m >= s && m <= e && !out.some((o) => o.depStr === c.depStr && o.key === c.key)) out.push(c);
    }
    const last = list[list.length - 1];
    if (ymd(last.dep) !== date || dmin(last.dep) >= e) break;
    time = m2t(dmin(last.dep) + 1);
  }
  return out.sort((a, b) => a.dep - b.dep);
}
function nextDate(days) {
  const d = new Date();
  for (let i = 0; i < 7; i++) { if (days.includes(dayIdx(d))) return d; d.setDate(d.getDate() + 1); }
  return new Date();
}
const todayIn = (cm) => cm.days.includes(dayIdx(new Date()));
function daysLabel(ds) {
  const s = ds.slice().sort();
  if (s.join() === '0,1,2,3,4') return 'Lu–Ve';
  if (s.length === 7) return 'Tous les jours';
  return s.map((i) => DAYS[i]).join(' ');
}
async function commuteStatus(cm) {
  if (!todayIn(cm)) return null;
  const k = cm.id + '|' + ymd(new Date()); const c = statusCache[k];
  if (c && Date.now() - c.at < 60000) return c.list;
  const list = await connsInWindow(cm.from, cm.to, ymd(new Date()), cm.start, cm.end);
  statusCache[k] = { at: Date.now(), list };
  return list;
}
function statusOf(p, list) {
  if (!list) return null;
  const m = list.find((c) => c.depStr === p.dep && c.key === p.key)
    || list.find((c) => c.key === p.key && Math.abs(dmin(c.dep) - t2m(p.dep)) <= 3);
  if (!m) return { text: 'Introuvable', cls: 'st-gone' };
  if (m.delay > 0) return { text: '+' + m.delay + ' min', cls: 'st-late' };
  return { text: 'À l’heure', cls: 'st-ok' };
}

/* ---------- suggestions d'arrêts ---------- */
function attachSuggest(input, box, onPick) {
  let t;
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 2) { box.innerHTML = ''; return; }
    t = setTimeout(async () => {
      try {
        const j = await api(`/locations?type=station&query=${encodeURIComponent(q)}`);
        box.innerHTML = (j.stations || []).filter((s) => s.id && s.name).slice(0, 6)
          .map((s) => `<button type="button" class="sugg-item" data-id="${esc(s.id)}" data-name="${esc(s.name)}">${esc(s.name)}</button>`).join('');
      } catch { box.innerHTML = ''; }
    }, 250);
  });
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.sugg-item'); if (!b) return;
    box.innerHTML = '';
    onPick({ id: b.dataset.id, name: b.dataset.name });
  });
}

/* ---------- navigation ---------- */
function go(screen, push = true) {
  clearTimeout(boardTimer);
  if (push && ['board', 'results', 'new'].includes(screen)) history.pushState({ s: screen }, '');
  S.screen = screen;
  const commuteTab = screen === 'commutes' || screen === 'new';
  $('#tabHome').classList.toggle('on', !commuteTab);
  $('#tabCommutes').classList.toggle('on', commuteTab);
  ({ home: renderHome, board: renderBoard, results: renderResults, commutes: renderCommutes, new: renderNew })[screen]();
  main.scrollTop = 0;
}
window.addEventListener('popstate', () => go(S.screen === 'new' ? 'commutes' : 'home', false));
document.querySelector('nav').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab);
});
const backBtn = (to) => `<button class="icon-btn" data-act="back" data-to="${to}" aria-label="Retour">${ICON.back}</button>`;

/* ---------- ACCUEIL ---------- */
function renderHome() {
  const geoLabel = S.geo ? `Ma position (${short(S.geo.name)})` : 'Ma position';
  main.innerHTML = `
    <header class="top"><h1 class="brand">Not TPG</h1></header>
    <div class="scroll">
      <form class="card" id="searchForm" autocomplete="off">
        <div class="field bb">${ICON.target}
          <label class="fl"><span class="label sm">Départ</span><input id="fromIn" value="${esc(S.fromText)}" placeholder="${esc(geoLabel)}"></label>
          <button type="button" class="icon-btn" data-act="locate" aria-label="Utiliser ma position">${ICON.locate}</button>
        </div>
        <div class="sugg" id="fromSugg"></div>
        <div class="field">${ICON.pin}
          <label class="fl"><span class="label sm">Destination</span><input id="toIn" value="${esc(S.toText)}" placeholder="Où vas-tu ?"></label>
          <button type="button" class="icon-btn" data-act="swap" aria-label="Inverser départ et destination">${ICON.swap}</button>
        </div>
        <div class="sugg" id="toSugg"></div>
        <div style="padding:8px 12px 12px"><button class="primary w100" type="submit">Rechercher un itinéraire</button></div>
      </form>
      <div id="nextCard"></div>
      <div class="sec-head"><h2 class="label">Mes arrêts</h2>
        ${favs.length ? `<button class="link" data-act="editFavs">${S.editFavs ? 'Terminé' : 'Modifier'}</button>` : ''}</div>
      <div class="card list">
        ${favs.map((f, i) => S.editFavs
          ? `<div class="row-btn"><span>${esc(short(f.name))}</span><span class="row-actions">
               ${i ? `<button class="icon-btn" data-act="favUp" data-i="${i}" aria-label="Monter">${ICON.up}</button>` : ''}
               <button class="icon-btn danger" data-act="favDel" data-i="${i}" aria-label="Supprimer">${ICON.trash}</button></span></div>`
          : `<button class="row-btn" data-act="openStop" data-i="${i}"><span>${esc(short(f.name))}</span>${ICON.chev}</button>`).join('')}
        <label class="field">${ICON.plus}<input id="addIn" placeholder="Ajouter un arrêt…" aria-label="Ajouter un arrêt"></label>
        <div class="sugg" id="addSugg"></div>
      </div>
      <p class="foot">Données : transport.opendata.ch</p>
    </div>`;

  const fromIn = $('#fromIn'), toIn = $('#toIn');
  fromIn.addEventListener('input', () => (S.fromText = fromIn.value));
  toIn.addEventListener('input', () => (S.toText = toIn.value));
  attachSuggest(fromIn, $('#fromSugg'), (s) => { S.fromText = fromIn.value = s.name; });
  attachSuggest(toIn, $('#toSugg'), (s) => { S.toText = toIn.value = s.name; });
  attachSuggest($('#addIn'), $('#addSugg'), (s) => {
    if (!favs.some((f) => f.id === s.id)) { favs.push(s); store.set('nt_favs', favs); }
    renderHome();
  });
  $('#searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const from = S.fromText.trim() || (S.geo && S.geo.name);
    const to = S.toText.trim();
    if (!from) return toast('Active la localisation ou saisis un départ.');
    if (!to) return toast('Saisis une destination.');
    S.q = { from, to }; S.res = [];
    go('results');
  });
  fillNext();
}

async function fillNext() {
  const el = $('#nextCard'); if (!el) return;
  const now = new Date(), nm = dmin(now), di = dayIdx(now);
  let best = null;
  for (const cm of commutes) {
    if (!cm.days.includes(di)) continue;
    for (const p of cm.picks) {
      const m = t2m(p.dep);
      if (m >= nm - 1 && m <= nm + 180 && (!best || m < t2m(best.p.dep))) best = { cm, p };
    }
  }
  if (!best) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="card next" data-tab-go="commutes">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <span class="label">Prochain trajet pendulaire</span>
        <span style="font-size:16px;font-weight:800">${esc(short(best.cm.from))} → ${esc(short(best.cm.to))}</span>
        <span class="small">Ligne ${esc(best.p.key)} · arrivée ${best.p.arr}</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="big" style="font-size:24px">${best.p.dep}</span>
        <span id="nextSt" class="small">…</span>
      </div>
    </button>`;
  el.querySelector('button').addEventListener('click', () => go('commutes'));
  try {
    const s = statusOf(best.p, await commuteStatus(best.cm));
    const st = $('#nextSt'); if (st && s) { st.className = s.cls; st.textContent = s.text; }
  } catch { const st = $('#nextSt'); if (st) st.textContent = ''; }
}

function locate() {
  if (!navigator.geolocation) return toast('Localisation indisponible sur cet appareil.');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const j = await api(`/locations?type=station&x=${pos.coords.latitude}&y=${pos.coords.longitude}`);
      const s = (j.stations || []).find((x) => x.id && x.name);
      if (s) { S.geo = { id: s.id, name: s.name }; S.fromText = ''; if (S.screen === 'home') renderHome(); }
    } catch {}
  }, () => toast('Localisation refusée : saisis ton départ à la main.'), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

/* ---------- DÉPARTS D'UN ARRÊT ---------- */
function renderBoard() {
  const f = S.stop;
  main.innerHTML = `
    <header class="top back">${backBtn('home')}<h1 class="title">${esc(short(f.name))}</h1></header>
    <div class="controls">
      <div class="chips" id="chips"></div>
      <div class="from-row">
        <label for="ft" class="muted-strong">À partir de</label>
        <input id="ft" class="time-in" type="time" value="${S.fromTime}">
        ${S.fromTime ? '<button class="ghost" data-act="clearTime">Maintenant</button>' : ''}
      </div>
    </div>
    <div class="scroll"><div class="card list" id="deps"><p class="empty">Chargement…</p></div><p class="foot" id="upd"></p></div>`;
  $('#ft').addEventListener('change', (e) => { S.fromTime = e.target.value; renderBoard(); });
  loadBoard();
}
async function loadBoard() {
  clearTimeout(boardTimer);
  let q = `/stationboard?id=${encodeURIComponent(S.stop.id)}&limit=80`;
  if (S.fromTime) q += `&datetime=${encodeURIComponent(ymd(new Date()) + ' ' + S.fromTime)}`;
  try {
    const j = await api(q);
    S.board = j.stationboard || [];
    if (S.screen === 'board') drawBoard();
  } catch {
    const d = $('#deps'); if (d) d.innerHTML = '<p class="empty">Impossible de charger les départs. Réessaie dans un instant.</p>';
  }
  if (!S.fromTime) boardTimer = setTimeout(() => { if (S.screen === 'board') loadBoard(); }, 30000);
}
function drawBoard() {
  const f = S.stop, active = filters[f.id] || [];
  const lineMap = new Map();
  S.board.forEach((d) => { const l = String(d.number || d.category); if (!lineMap.has(l)) lineMap.set(l, { l, cat: d.category, num: d.number }); });
  const lines = [...lineMap.values()].sort((a, b) => a.l.localeCompare(b.l, 'fr', { numeric: true }));
  $('#chips').innerHTML = `<button class="chip ${active.length ? '' : 'on-dark'}" data-act="lineAll">Toutes</button>` +
    lines.map((x) => {
      const on = active.includes(x.l), c = lineColor(x.cat, x.num);
      return `<button class="chip" data-act="lineToggle" data-l="${esc(x.l)}" aria-pressed="${on}"
        style="${on ? `background:${c};color:#fff;border-color:${c}` : `color:${c};border-color:${c}`}">${esc(x.l)}</button>`;
    }).join('');

  const now = Date.now();
  const rows = S.board.filter((d) => !active.length || active.includes(String(d.number || d.category))).slice(0, 25).map((d) => {
    const planned = parseISO(d.stop.departure);
    const delay = d.stop.delay || 0;
    const prog = parseISO(d.stop.prognosis && d.stop.prognosis.departure);
    const real = prog || new Date(planned.getTime() + delay * 60000);
    const diff = Math.round((real - now) / 60000);
    const big = S.fromTime || diff > 59 ? hm(real) : (diff <= 0 ? 'Imm.' : diff + ' min');
    return `<div class="dep">${badge(d.category, d.number)}
      <div class="dep-to"><span class="to">${esc(short(d.to))}</span>
        <span class="small">Prévu ${hm(planned)}${d.stop.platform ? ' · quai ' + esc(d.stop.platform) : ''}</span></div>
      <div class="dep-r"><span class="big">${big}</span>${delay > 0 ? `<span class="st-late">+${delay} min</span>` : ''}</div></div>`;
  }).join('');
  $('#deps').innerHTML = rows || '<p class="empty">Aucun départ pour ce filtre.</p>';
  $('#upd').textContent = 'Mis à jour à ' + hm(new Date()) + (active.length ? ' · filtre mémorisé pour cet arrêt' : '');
}

/* ---------- RÉSULTATS D'ITINÉRAIRE ---------- */
function renderResults() {
  main.innerHTML = `
    <header class="top back">${backBtn('home')}
      <div style="display:flex;flex-direction:column;min-width:0">
        <span class="small">${esc(short(S.q.from))}</span>
        <h1 class="title" style="font-size:21px">→ ${esc(short(S.q.to))}</h1>
      </div></header>
    <div class="scroll stack" id="res"><p class="empty">Recherche…</p></div>`;
  loadResults(hm(new Date()));
}
async function loadResults(time) {
  try {
    const list = await getConns(S.q.from, S.q.to, ymd(new Date()), time, 6);
    S.res = S.res.concat(list.filter((c) => !S.res.some((o) => o.depStr === c.depStr && o.key === c.key)));
    const el = $('#res'); if (!el) return;
    el.innerHTML = S.res.length ? S.res.map((c) => `
      <div class="card conn">
        <div class="conn-top"><span class="big2">${c.depStr} <span class="dash">–</span> ${c.arrStr}</span><span class="muted" style="font-weight:700">${c.dur} min</span></div>
        <div class="conn-legs">${c.legs.map((l) => badge(l.cat, l.num, true)).join('')}
          <span class="muted sm">${c.transfers ? c.transfers + ' changement' + (c.transfers > 1 ? 's' : '') : 'direct'}</span>
          ${c.delay ? `<span class="st-late ml">+${c.delay} min</span>` : ''}</div>
      </div>`).join('') + '<button class="ghost" data-act="later" style="align-self:center">Plus tard</button>'
      : '<div class="card empty-card">Aucune liaison trouvée. Vérifie le nom des arrêts.</div>';
  } catch {
    const el = $('#res'); if (el) el.innerHTML = '<div class="card empty-card">Impossible de charger les liaisons.</div>';
  }
}

/* ---------- TRAJETS PENDULAIRES ---------- */
function renderCommutes() {
  main.innerHTML = `
    <header class="top"><h1 class="brand sm">Pendulaire</h1><button class="ghost" data-act="newCommute">+ Nouveau</button></header>
    <div class="scroll stack">
      ${commutes.length ? commutes.map((cm, i) => `
        <div class="card cm">
          <div>
            <div class="cm-title">${esc(short(cm.from))} → ${esc(short(cm.to))}</div>
            <div class="muted sm">${daysLabel(cm.days)} · ${cm.start}–${cm.end} · ${cm.picks.length} liaison${cm.picks.length > 1 ? 's' : ''}</div>
            ${todayIn(cm) ? '' : '<div class="muted sm">Pas de trajet aujourd’hui</div>'}
          </div>
          <div class="cm-list">${cm.picks.map((p, j) => `
            <div class="cm-row"><span class="cm-time">${p.dep} → ${p.arr}</span>
              <span class="cm-legs">${p.legs.map((l) => badge(l.cat, l.num, true)).join('')}</span>
              <span id="st-${i}-${j}" class="small">${todayIn(cm) ? '…' : ''}</span></div>`).join('')}
          </div>
          <div class="row gap">
            <button class="ghost" data-act="reverse" data-i="${i}">Créer le retour</button>
            <button class="ghost danger" data-act="delCommute" data-i="${i}">Supprimer</button>
          </div>
        </div>`).join('')
        : '<div class="card empty-card">Aucun trajet enregistré.<br>Crée ton premier trajet avec « + Nouveau ».</div>'}
    </div>`;
  commutes.forEach(async (cm, i) => {
    if (!todayIn(cm)) return;
    try {
      const list = await commuteStatus(cm);
      cm.picks.forEach((p, j) => {
        const s = statusOf(p, list), el = $(`#st-${i}-${j}`);
        if (el && s) { el.className = s.cls; el.textContent = s.text; }
      });
    } catch { cm.picks.forEach((p, j) => { const el = $(`#st-${i}-${j}`); if (el) el.textContent = '—'; }); }
  });
}

function renderNew() {
  const d = S.draft;
  main.innerHTML = `
    <header class="top back">${backBtn('commutes')}<h1 class="title" style="font-size:22px">Nouveau trajet</h1></header>
    <div class="scroll stack">
      <div class="card">
        <label class="field bb"><span class="label" style="width:64px">Départ</span><input id="dFrom" value="${esc(d.from)}" placeholder="Arrêt de départ" autocomplete="off"></label>
        <div class="sugg" id="dFromSugg"></div>
        <label class="field"><span class="label" style="width:64px">Arrivée</span><input id="dTo" value="${esc(d.to)}" placeholder="Arrêt d’arrivée" autocomplete="off"></label>
        <div class="sugg" id="dToSugg"></div>
      </div>
      <div><span class="label" style="margin-left:4px">Jours</span>
        <div class="days">${DAYS.map((l, i) => `<button class="day ${d.days.includes(i) ? 'on' : ''}" data-act="day" data-i="${i}" aria-pressed="${d.days.includes(i)}">${l}</button>`).join('')}</div>
      </div>
      <div><span class="label" style="margin-left:4px">Départ entre</span>
        <div class="row gap" style="margin-top:8px">
          <input id="dStart" class="time-in f1" type="time" value="${d.start}" aria-label="Heure de début">
          <span class="muted-strong">et</span>
          <input id="dEnd" class="time-in f1" type="time" value="${d.end}" aria-label="Heure de fin">
        </div>
      </div>
      <button class="primary" data-act="loadCands">Voir les liaisons</button>
      <div id="cands"></div>
    </div>`;
  const fi = $('#dFrom'), ti = $('#dTo');
  fi.addEventListener('input', () => (d.from = fi.value));
  ti.addEventListener('input', () => (d.to = ti.value));
  attachSuggest(fi, $('#dFromSugg'), (s) => { d.from = fi.value = s.name; });
  attachSuggest(ti, $('#dToSugg'), (s) => { d.to = ti.value = s.name; });
  $('#dStart').addEventListener('change', (e) => { d.start = e.target.value; d.cands = null; $('#cands').innerHTML = ''; });
  $('#dEnd').addEventListener('change', (e) => { d.end = e.target.value; d.cands = null; $('#cands').innerHTML = ''; });
  if (d.cands) drawCands();
}
async function loadCands() {
  const d = S.draft;
  if (!d.from.trim() || !d.to.trim()) return toast('Saisis un départ et une arrivée.');
  if (!d.days.length) return toast('Choisis au moins un jour.');
  if (t2m(d.end) < t2m(d.start)) return toast('L’heure de fin doit être après l’heure de début.');
  const box = $('#cands'); box.innerHTML = '<p class="empty">Recherche des liaisons…</p>';
  try {
    const date = nextDate(d.days);
    const list = await connsInWindow(d.from.trim(), d.to.trim(), ymd(date), d.start, d.end);
    d.cands = list.map((c) => ({ dep: c.depStr, arr: c.arrStr, dur: c.dur, legs: c.legs, key: c.key }));
    d.candDay = DAYS_LONG[dayIdx(date)] + ' ' + date.getDate() + '.' + (date.getMonth() + 1) + '.';
    d.picks = [];
    drawCands();
  } catch { box.innerHTML = '<p class="empty">Impossible de charger les liaisons. Vérifie le nom des arrêts.</p>'; }
}
function drawCands() {
  const d = S.draft, box = $('#cands');
  if (!d.cands.length) { box.innerHTML = '<div class="card empty-card">Aucune liaison dans cette plage horaire.</div>'; return; }
  box.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="label" style="margin-left:4px">Choisis tes liaisons</span>
      <span class="small" style="margin-left:4px">D’après l’horaire du ${esc(d.candDay)}</span>
      <div class="card list">${d.cands.map((c, i) => `
        <label class="cand"><input type="checkbox" data-ci="${i}" ${d.picks.includes(i) ? 'checked' : ''}>
          <span class="cm-time">${c.dep} → ${c.arr}</span>
          <span class="cm-legs">${c.legs.map((l) => badge(l.cat, l.num, true)).join('')}</span>
          <span class="small">${c.dur} min</span></label>`).join('')}
      </div>
      <button class="primary" data-act="saveCommute">Enregistrer le trajet</button>
    </div>`;
  box.querySelectorAll('input[data-ci]').forEach((cb) => cb.addEventListener('change', () => {
    const i = Number(cb.dataset.ci);
    d.picks = cb.checked ? d.picks.concat([i]) : d.picks.filter((x) => x !== i);
  }));
}

/* ---------- actions (clics) ---------- */
const ACT = {
  back: (ds) => history.state ? history.back() : go(ds.to, false),
  locate: () => { S.fromText = ''; const i = $('#fromIn'); if (i) i.value = ''; locate(); },
  swap: () => {
    const from = S.fromText.trim() || (S.geo ? S.geo.name : '');
    S.fromText = S.toText; S.toText = from; renderHome();
  },
  editFavs: () => { S.editFavs = !S.editFavs; renderHome(); },
  favUp: (ds) => { const i = +ds.i; [favs[i - 1], favs[i]] = [favs[i], favs[i - 1]]; store.set('nt_favs', favs); renderHome(); },
  favDel: (ds) => { favs.splice(+ds.i, 1); store.set('nt_favs', favs); if (!favs.length) S.editFavs = false; renderHome(); },
  openStop: (ds) => { S.stop = favs[+ds.i]; S.fromTime = ''; S.board = []; go('board'); },
  lineAll: () => { filters[S.stop.id] = []; store.set('nt_filters', filters); drawBoard(); },
  lineToggle: (ds) => {
    const a = filters[S.stop.id] || [];
    filters[S.stop.id] = a.includes(ds.l) ? a.filter((x) => x !== ds.l) : a.concat([ds.l]);
    store.set('nt_filters', filters); drawBoard();
  },
  clearTime: () => { S.fromTime = ''; renderBoard(); },
  later: () => { const last = S.res[S.res.length - 1]; if (last) loadResults(m2t(dmin(last.dep) + 1)); },
  newCommute: () => { S.draft = { from: '', to: '', days: [0, 1, 2, 3, 4], start: '07:00', end: '08:00', picks: [], cands: null }; go('new'); },
  reverse: (ds) => {
    const cm = commutes[+ds.i];
    S.draft = { from: cm.to, to: cm.from, days: cm.days.slice(), start: '17:00', end: '18:30', picks: [], cands: null };
    go('new');
  },
  delCommute: (ds) => {
    const cm = commutes[+ds.i];
    if (!confirm(`Supprimer le trajet ${short(cm.from)} → ${short(cm.to)} ?`)) return;
    commutes.splice(+ds.i, 1); store.set('nt_commutes', commutes); renderCommutes();
  },
  day: (ds, el) => {
    const d = S.draft, i = +ds.i;
    d.days = d.days.includes(i) ? d.days.filter((x) => x !== i) : d.days.concat([i]);
    el.classList.toggle('on', d.days.includes(i)); el.setAttribute('aria-pressed', d.days.includes(i));
    d.cands = null; $('#cands').innerHTML = '';
  },
  loadCands: () => loadCands(),
  saveCommute: () => {
    const d = S.draft;
    if (!d.picks.length) return toast('Coche au moins une liaison.');
    commutes.push({
      id: Date.now(), from: d.from.trim(), to: d.to.trim(), days: d.days.slice().sort(),
      start: d.start, end: d.end, picks: d.picks.slice().sort((a, b) => a - b).map((i) => d.cands[i])
    });
    store.set('nt_commutes', commutes);
    toast('Trajet enregistré.');
    history.state ? history.back() : go('commutes', false);
  }
};
main.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});

/* ---------- démarrage ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (S.screen === 'board') loadBoard();
    if (S.screen === 'home') fillNext();
  }
});
go('home', false);
locate();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
