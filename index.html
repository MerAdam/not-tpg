async function loadCands() {
  const d = S.draft;
  if (!d.from.trim() || !d.to.trim()) return toast('Saisis un départ et une arrivée.');
  if (!d.days.length) return toast('Choisis au moins un jour.');
  if (t2m(d.end) < t2m(d.start)) return toast('L’heure de fin doit être après l’heure de début.');
  const box = $('#cands'); box.innerHTML = '<p class="empty">Recherche des liaisons…</p>';
  try {
    const date = nextDate(d.days);
    const list = await connsInWindow(d.from.trim(), d.to.trim(), ymd(date), d.start, d.end);
    d.cands = list.map((c) => ({ dep: c.depStr, arr: c.arrStr, dur: c.dur, legs: c.legs, key: c.key }));
    d.candDay = dateLabel(ymd(date));
    d.picks = [];
    drawCands();
  } catch { box.innerHTML = '<p class="empty">Impossible de charger les liaisons. Vérifie le nom des arrêts.</p>'; }
}
function drawCands() {
  const d = S.draft, box = $('#cands');

  box.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px">

/* ---------- PERTURBATIONS (info trafic tpg via api/infotrafic) ---------- */
let ALERTS = [];
const AL = (() => { const v = store.get('nt_alerts2', null); return v && Array.isArray(v.list) ? v : { list: [], at: 0 }; })();
let alertsError = null, alertsLoading = false, alertsSig = '';
const WARN_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4M12 17h.01"/></svg>';
const causeLabel = (a) => a.cause || '';
function mergeAlerts() { ALERTS = (AL.list || []).filter((a) => a.title || a.text); }
mergeAlerts();
// Info trafic tpg (api/infotrafic, cache 60 s côté serveur)
async function loadAlerts(force) {
  if (alertsLoading) return;
  if (!force && Date.now() - (AL.at || 0) < 55000) return;
  alertsLoading = true;
  let err = null;
  try {
    const r = await fetch('/api/infotrafic');
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    AL.list = j.alerts || []; AL.at = Date.now();
    store.set('nt_alerts2', AL);
  } catch (e) { err = e.message; }
  alertsLoading = false;
  alertsError = err;
  mergeAlerts();
  const sig = ALERTS.map((x) => x.id).join('|') + '#' + (err ? 1 : 0);
  if (sig !== alertsSig) { alertsSig = sig; onAlertsChanged(); }
}
function onAlertsChanged() {
  switch (S.screen) {
    case 'infos': renderInfos(); break;
    case 'board': if (S.board.length) drawBoard(); break;
    case 'results': drawResults(); break;
    case 'commutes': renderCommutes(); break;
    case 'journey': case 'trip': { const sc = main.querySelector('.scroll'), y = sc ? sc.scrollTop : 0; go(S.screen, false); const n = main.querySelector('.scroll'); if (n) n.scrollTop = y; break; }
  }
}
const ts = (s) => (s ? Date.parse(s) : NaN);
function activeAt(a, t) {
  if (!a.periods || !a.periods.length) return true;
  const x = t.getTime();
  return a.periods.some(([s, e]) => (isNaN(ts(s)) || ts(s) <= x) && (isNaN(ts(e)) || ts(e) >= x));
}
function nextStart(a, t) {
  const x = t.getTime();
  const starts = (a.periods || []).map(([s]) => ts(s)).filter((v) => !isNaN(v) && v > x);
  return starts.length ? Math.min(...starts) : null;
}
// Perturbations qui touchent une liaison : même ligne, même direction (si la perturbation
// n'en concerne qu'une), arrêts desservis si connus, et liaison dans les prochaines 24 h
const sameDir = (dir, to) => {
  if (!dir || !to) return true;
  const a = fold(dir).replace(/ /g, ''), b = fold(to).replace(/ /g, '');
  return a.includes(b) || b.includes(a);
};
function alertsFor(lines, stops, t, to) {
  const L = (lines || []).map((x) => String(x || '').trim().toUpperCase()).filter(Boolean);
  const st = new Set((stops || []).filter(Boolean).map(String));
  const when = t || new Date();
  if (when.getTime() > Date.now() + 24 * 3600e3 || when.getTime() < Date.now() - 6 * 3600e3) return [];
  return ALERTS.filter((a) => {
    if (!activeAt(a, when)) return false;
    if (a.lines && a.lines.length) {
      if (!a.lines.some((l) => L.includes(l))) return false;
      if (!sameDir(a.direction, to)) return false;
      return !a.stops || !a.stops.length || !st.size || a.stops.some((s) => st.has(s));
    }
    return a.stops && a.stops.some((s) => st.has(s));
  });
}
function warnHtml(list) {
  if (!list || !list.length) return '';
  return `<span class="warn" role="button" tabindex="0" data-act="alerts" data-ids="${esc(list.map((a) => a.id).join(','))}">${WARN_ICON}Attention${list.length > 1 ? ' (' + list.length + ')' : ''}</span>`;
}
const fmtDT = (s) => {
  const d = new Date(s), today = new Date();
  const same = ymd(d) === ymd(today);
  const tom = new Date(today); tom.setDate(tom.getDate() + 1);
  const day = same ? 'aujourd’hui' : ymd(d) === ymd(tom) ? 'demain' : DAYS_LONG[dayIdx(d)] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
  return day + ' à ' + hm(d);
};
function periodLabel(a) {
  const now = new Date();
  const ps = (a.periods || []).filter(([s, e]) => isNaN(ts(e)) || ts(e) >= now.getTime());
  if (!ps.length) return '';
  const cur = ps.find(([s, e]) => (isNaN(ts(s)) || ts(s) <= now.getTime()));
  if (cur) return isNaN(ts(cur[1])) ? 'En cours, fin non communiquée' : 'Jusqu’à ' + fmtDT(cur[1]);
  const [s, e] = ps.sort((x, y) => ts(x[0]) - ts(y[0]))[0];
  return 'Dès ' + fmtDT(s) + (isNaN(ts(e)) ? '' : ' jusqu’à ' + fmtDT(e)) + (ps.length > 1 ? ' (plusieurs périodes)' : '');
}
const lineBadges = (a, max = 8) => (a.lines || []).slice(0, max).map((l) => badge('B', l, true)).join('') + ((a.lines || []).length > max ? `<span class="small">+${a.lines.length - max}</span>` : '');
function alertDetailHtml(a) {

    <div class="stack" style="gap:10px;margin-bottom:18px">

    </div>`;
}
function openAlerts(ids) {
  const list = ids.map((id) => ALERTS.find((a) => a.id === id)).filter(Boolean);
  if (!list.length) return toast('Cette perturbation n’est plus en cours.');

function connAlerts(c) {
  const seen = new Map();
  for (const s of c.raw.sections || []) {
    if (!s.journey) continue;
    const t = parseISO(s.departure && s.departure.departure) || c.dep;
    for (const a of alertsFor([s.journey.number], (s.journey.passList || []).map((p) => p.station && p.station.id), t, s.journey.to)) seen.set(a.id, a);
  }
  return [...seen.values()];
}
function todayAt(hhmm) { const d = new Date(); const [h, m] = String(hhmm).split(':').map(Number); d.setHours(h || 0, m || 0, 0, 0); return d; }

/* ---------- INFOS ---------- */
function renderInfos() {
  const now = new Date(), week = now.getTime() + 7 * 864e5;
  const lineKey = (a) => (a.lines && a.lines.length ? a.lines.slice().sort((x, y) => x.localeCompare(y, 'fr', { numeric: true }))[0] : '~');
  const byLine = (x, y) => lineKey(x).localeCompare(lineKey(y), 'fr', { numeric: true });
  const current = ALERTS.filter((a) => activeAt(a, now)).sort(byLine);
  const soon = ALERTS.filter((a) => !activeAt(a, now)).filter((a) => { const n = nextStart(a, now); return n && n <= week; })
    .sort((x, y) => nextStart(x, now) - nextStart(y, now));
  const card = (a) => `
    <button class="card alert-card" data-act="alertOne" data-id="${esc(a.id)}">
      <div class="row gap" style="justify-content:space-between;width:100%">
        <span class="a-lines">${lineBadges(a) || '<span class="small">Réseau tpg</span>'}</span>
        ${causeLabel(a) ? `<span class="a-tag">${esc(causeLabel(a))}</span>` : ''}
      </div>
      <span class="a-title">${esc(a.title || 'Perturbation')}</span>
      ${periodLabel(a) ? `<span class="small">${esc(periodLabel(a))}</span>` : ''}
    </button>`;
  const upd = AL.at || 0;
  main.innerHTML = `
    <header class="top"><h1 class="brand sm">Infos trafic</h1></header>
    <div class="scroll stack">
      ${alertsError && !ALERTS.length ? `<div class="card empty-card">Impossible de charger les perturbations pour le moment.<br><span class="small">${esc(alertsError)}</span></div>` : ''}
      <h2 class="label" style="margin:4px 4px 0">En cours${current.length ? ' · ' + current.length : ''}</h2>
      ${current.length ? current.map(card).join('') : `<div class="card empty-card">${upd ? 'Aucune perturbation en cours sur le réseau tpg.' : 'Chargement…'}</div>`}
      ${soon.length ? `<h2 class="label" style="margin:10px 4px 0">À venir · 7 jours</h2>${soon.map(card).join('')}` : ''}
      <p class="foot">${upd ? 'Mis à jour à ' + hm(new Date(upd)) + ' · ' : ''}Source : info trafic tpg.ch. Tire vers le bas pour actualiser.</p>
    </div>`;
  loadAlerts();
}

/* ---------- NOTIFICATIONS (Web Push via api/push et api/check) ---------- */
const NT = { sid: store.get('nt_push_sid', null), bells: store.get('nt_bells', []).filter((b) => Date.parse(b.planned) > Date.now() - 3 * 3600e3) };
store.set('nt_bells', NT.bells);
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const BELL = (on) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>`;
const bellKey = (stopId, d) => [stopId, d.number || d.category, d.stop.departure, d.to].join('|');
const hasBell = (key) => NT.bells.some((b) => b.key === key);
const bellHtml = (key, i) => { const on = hasBell(key); return `<span class="bell ${on ? 'on' : ''}" role="button" tabindex="0" data-act="bell" data-i="${i}" aria-pressed="${on}" aria-label="${on ? 'Arrêter le suivi' : 'Suivre ce départ'}">${BELL(on)}</span>`; };
function b64ToBytes(s) {
  const b = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...b].map((c) => c.charCodeAt(0)));
}
async function pushApi(action, body) {
  const r = await fetch('/api/push?action=' + action, body
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Erreur ' + r.status); e.resubscribe = j.resubscribe; throw e; }
  return j;
}
async function enableNotifications() {
  if (!pushSupported()) throw new Error(isIOS() ? 'Sur iPhone, ajoute d’abord l’app à l’écran d’accueil.' : 'Notifications non disponibles sur ce navigateur.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications refusées dans les réglages du téléphone.');
  const reg = await navigator.serviceWorker.ready;
  const { publicKey } = await pushApi('key');
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  const { sid } = await pushApi('subscribe', { subscription: sub.toJSON() });
  NT.sid = sid; store.set('nt_push_sid', sid);
  await syncCommutes();
}
async function disableNotifications() {
  try { if (NT.sid) await pushApi('unsubscribe', { sid: NT.sid }); } catch {}
  try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch {}
  NT.sid = null; NT.bells = []; store.set('nt_push_sid', null); store.set('nt_bells', []);
}
async function syncCommutes() {
  if (!NT.sid) return;
  try {
    await pushApi('commutes', { sid: NT.sid, commutes: commutes.map((c) => ({ id: c.id, from: c.from, to: c.to, days: c.days, picks: c.picks.map((p) => ({ dep: p.dep, arr: p.arr, key: p.key, legs: p.legs })) })) });
  } catch (e) { if (e.resubscribe) { NT.sid = null; store.set('nt_push_sid', null); } }
}
async function toggleBell(d, stop) {
  const key = bellKey(stop.id, d);
  const existing = NT.bells.find((b) => b.key === key);
  try {
    if (!NT.sid) { toast('Activation des notifications…'); await enableNotifications(); }
    if (existing) {
      await pushApi('unbell', { sid: NT.sid, wid: existing.wid });
      NT.bells = NT.bells.filter((b) => b.key !== key);
      toast('Suivi arrêté.');
    } else {
      const planned = parseISO(d.stop.departure);
      const { wid } = await pushApi('bell', { sid: NT.sid, run: { stopId: stop.id, stopName: stop.name, line: String(d.number || d.category), cat: d.category, to: d.to, planned: planned.toISOString() } });
      NT.bells.push({ key, wid, planned: planned.toISOString() });
      toast('Suivi activé : tu seras prévenu des changements.');
    }
    store.set('nt_bells', NT.bells);
  } catch (e) {
    if (e.resubscribe) { NT.sid = null; store.set('nt_push_sid', null); }
    toast(e.message);
  }
}

function tutoViewer(guide, opts = {}) {
  return `<div class="tuto-viewer" data-guide="${guide.id}">
      <div class="tuto-track">${guide.slides.map((sl) => `<section class="tuto-slide">${sl.i()}<h2>${sl.t}</h2><p>${sl.p}</p></section>`).join('')}</div>
      <div class="tuto-nav">
        <button class="ghost" data-tnav="prev" style="visibility:hidden">Précédent</button>
        <div class="dots">${guide.slides.map((_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div>
        <button class="primary" data-tnav="next" style="height:40px;padding:0 16px;font-size:14px">${guide.slides.length > 1 ? 'Suivant' : (opts.doneLabel || 'Terminer')}</button>
      </div>
    </div>`;
}
function mountViewer(root, guide, onDone, opts = {}) {
  const track = root.querySelector('.tuto-track'), dots = [...root.querySelectorAll('.dots i')];
  const prev = root.querySelector('[data-tnav="prev"]'), next = root.querySelector('[data-tnav="next"]');
  const n = guide.slides.length;
  let idx = 0;
  const update = () => {
    dots.forEach((d, k) => d.classList.toggle('on', k === idx));
    prev.style.visibility = idx ? 'visible' : 'hidden';
    next.textContent = idx === n - 1 ? (opts.doneLabel || 'Terminer') : 'Suivant';
  };
  track.addEventListener('scroll', () => {
    const k = Math.round(track.scrollLeft / track.clientWidth);
    if (k !== idx) { idx = Math.max(0, Math.min(n - 1, k)); update(); }
  }, { passive: true });
  const goTo = (k) => track.scrollTo({ left: k * track.clientWidth, behavior: 'smooth' });
  prev.addEventListener('click', () => goTo(idx - 1));
  next.addEventListener('click', () => (idx === n - 1 ? onDone() : goTo(idx + 1)));
}

  main.innerHTML = `

      <button class="ghost" data-act="replayWelcome" style="align-self:center">Revoir l’écran de bienvenue</button>
    </div>`;
}
function renderTuto() {
  const g = TUTOS.find((x) => x.id === S.tuto) || TUTOS[0];
  main.innerHTML = `<header class="top back">${backBtn()}<h1 class="title" style="font-size:20px">${g.title}</h1></header>${tutoViewer(g)}`;
  mountViewer(main.querySelector('.tuto-viewer'), g, () => (history.state ? history.back() : go('tutos', false)));
}

async function permState(name) {
  try {
    if (name === 'notifications') {
      if (!pushSupported()) return 'unsupported';
      const n = Notification.permission; // 'granted' | 'denied' | 'default'
      return n === 'default' ? 'prompt' : n;

    if (!navigator.geolocation) return 'unsupported';
    if (navigator.permissions && navigator.permissions.query) return (await navigator.permissions.query({ name })).state;
  } catch {}

}
const PERM_LABEL = {
  granted: ['Autorisée', 'var(--ok)'], denied: ['Bloquée', 'var(--bad)'], prompt: ['Pas encore demandée', 'var(--muted)'],
  unsupported: ['Non disponible', 'var(--muted)'], unknown: ['Inconnue', 'var(--muted)']
};
async function fillPermRows() {
  const el = $('#permRows'); if (!el) return;
  let [geo, notif] = await Promise.all([permState('geolocation'), permState('notifications')]);
  // Certains navigateurs (Samsung Internet notamment) refusent sans rien demander
  // tout en indiquant « pas encore demandée » : on se fie au dernier refus réel.
  if (geo !== 'granted' && geo !== 'unsupported' && store.get('nt_geo_denied', false)) geo = 'denied';
  const row = (key, icon, title, state) => {
    const [label, color] = PERM_LABEL[state] || PERM_LABEL.unknown;
    const action = state === 'granted' || state === 'unsupported' ? ''
      : state === 'denied' ? `<button class="ghost" data-act="permHelp" data-p="${key}">Comment réactiver ?</button>`
      : `<button class="ghost" data-act="permAsk" data-p="${key}">Autoriser</button>`;
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)">
      <span style="color:var(--muted);display:inline-flex">${icon}</span>
      <span style="flex:1;display:flex;flex-direction:column"><b style="font-size:15px">${title}</b><span style="font-size:13px;font-weight:800;color:${color}">${label}</span></span>
      ${action}</div>`;
  };
  el.innerHTML = row('geo', ICON.locate, 'Localisation', geo) + row('notif', BELL(false), 'Notifications', notif) +
    `<button class="link" data-act="permHelp" data-p="geo" style="align-self:flex-start;padding:0">Aide : la localisation ne marche pas</button>`;
  // Mise à jour si l'autorisation change pendant que la page est ouverte
  try {
    if (navigator.permissions && !fillPermRows.watching) {
      fillPermRows.watching = true;
      const st = await navigator.permissions.query({ name: 'geolocation' });
      st.onchange = () => { if (S.screen === 'settings') fillPermRows(); };
    }

}

const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const getTheme = () => store.get('nt_theme', 'system');
function applyTheme() {
  const t = getTheme();
  const dark = t === 'dark' || (t === 'system' && darkMQ && darkMQ.matches);
  document.documentElement.classList.toggle('dark', dark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#121316' : '#F4F3EF');
}
// Change de thème avec une animation : cercle depuis (x, y) si possible, sinon fondu
function themeTransition(update, x, y) {
  const wasDark = document.documentElement.classList.contains('dark');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fade = () => {
    const html = document.documentElement;
    html.classList.add('theming'); update();
    clearTimeout(themeTransition._t); themeTransition._t = setTimeout(() => html.classList.remove('theming'), 500);
  };
  if (reduce) { update(); return; }
  if (!document.startViewTransition || x == null) { fade(); return; }
  const vt = document.startViewTransition(update);
  vt.ready.then(() => {
    if (wasDark === document.documentElement.classList.contains('dark')) return; // rien ne change visuellement
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.documentElement.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
      { duration: 550, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => {});
}

    commutes.push({
      id: Date.now(), from: d.from.trim(), to: d.to.trim(), days: d.days.slice().sort(),
      start: d.start, end: d.end, picks: d.picks.slice().sort((a, b) => a - b).map((i) => d.cands[i])
    });
    store.set('nt_commutes', commutes);
    syncCommutes();
    toast('Trajet enregistré.');
    history.state ? history.back() : go('commutes', false);
  }
};
function renderResultsAndReload() { S.res = []; renderResults(); }
main.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});

/* ---------- démarrage ---------- */
// Bloque le zoom (pincement sur iOS, double-tap partout)
['gesturestart', 'gesturechange'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (S.screen === 'board') loadBoard();
    if (S.screen === 'home') fillNext();
  }
});
applyTheme();
go('home', false);
if (!store.get('nt_welcome_done', false)) dataReady.then(() => setTimeout(showWelcome, 400));
loadAlerts();
if (NT.sid) syncCommutes();
setInterval(() => { if (document.visibilityState === 'visible') loadAlerts(); }, 60000);
dataReady.then(() => { if (S.screen === 'board' && S.board.length) drawBoard(); if (S.screen === 'commutes') renderCommutes(); });
locate({ silent: true });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
