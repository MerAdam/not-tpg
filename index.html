<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Not TPG">
<meta name="description" content="Prochains départs tpg, itinéraires et trajets pendulaires">
<title>Not TPG</title>
<script>
  // Thème appliqué avant l'affichage pour éviter un flash clair/sombre
  (function () {
    var t = 'system';
    try { t = JSON.parse(localStorage.getItem('nt_theme')) || 'system'; } catch (e) {}
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root{
    --ground:#F4F3EF; --card:#FFFFFF; --ink:#15171C; --muted:#5E6470; --faint:#8A8F98;
    --line:#E4E2DC; --line2:#EFEDE8; --accent:#C2410C; --ok:#15803D; --late:#B45309; --bad:#B91C1C;
    --border2:#D6D3CC; --sugg:#FAF9F6; --seg:#E9E7E1; --on-accent:#FFFFFF; --on-bad:#FFFFFF; --bad-soft:#FDECEC; color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--ground);color:var(--ink);touch-action:manipulation;-webkit-text-size-adjust:100%}
  /* feuille du bas (filtres) */
  #sheet{position:fixed;inset:0;z-index:20;display:none}
  #sheet.open{display:block}
  #sheet .backdrop{position:absolute;inset:0;background:rgba(21,23,28,.45)}
  #sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--ground);border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:80dvh;overflow-y:auto;overscroll-behavior:contain}
  #sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border2);margin:0 auto 12px}
  #sheet h2{margin:0 0 12px;font-size:20px;font-weight:900}
  .pill{height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--border2);background:var(--card);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .pill.set{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .pill svg{flex:none}
  .star{color:var(--faint)}
  .star.on{color:#E8A400}
  .fav-name{display:flex;align-items:center;gap:10px;min-width:0}
  .fav-name svg{flex:none;color:#E8A400}
  .fav-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit;color:var(--ink)}
  #app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
  #main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;z-index:1}
  .scroll{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .stack{display:flex;flex-direction:column;gap:12px}
  .stack > *{flex-shrink:0} /* sinon les cartes se tassent au lieu de défiler */
  .top{padding:calc(env(safe-area-inset-top) + 18px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .top.back{padding-left:8px;justify-content:flex-start;gap:4px}
  .brand{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em}
  .brand.sm{font-size:28px}
  .title{margin:0;font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .list{overflow:hidden}
  .label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .label.sm{font-size:11px}
  .muted{color:var(--muted)} .sm{font-size:13px}
  .muted-strong{font-size:14px;font-weight:700;color:var(--muted)}
  .field{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 6px 0 14px}
  .field.bb{border-bottom:1px solid var(--line2)}
  .field input{flex:1;border:0;outline:none;background:transparent;font-size:17px;font-weight:700;min-width:0;padding:0}
  .field input::placeholder{color:var(--faint);font-weight:600}
  .fl{display:flex;flex-direction:column;flex:1;min-width:0}
  .icon-btn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:12px}
  .icon-btn:active{background:var(--line2)}
  .danger{color:var(--bad)!important}
  .primary{height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
  .primary:active{filter:brightness(.92)}
  .w100{width:100%}
  .ghost{height:40px;padding:0 14px;border:1.5px solid var(--border2);border-radius:12px;background:var(--card);font-weight:700;font-size:14px}
  .link{background:none;border:0;color:var(--accent);font-weight:800;font-size:14px;min-height:44px;padding:0 4px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 6px}
  .row-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 12px 0 16px;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;font-size:17px;font-weight:700}
  .row-actions{display:flex}
  .sugg{display:flex;flex-direction:column}
  .sugg-item{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;text-align:left;background:var(--sugg);border:0;border-top:1px solid var(--line2);font-weight:700;font-size:15px}
  .kind{font-size:11px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:auto}
  .foot{margin:12px 4px 0;font-size:12px;color:var(--muted)}
  .empty{margin:0;padding:20px 16px;color:var(--muted)}
  .empty-card{padding:24px 18px;text-align:center;color:var(--muted)}
  .badge{min-width:42px;height:30px;padding:0 8px;border-radius:8px;font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .badge-sm{min-width:30px;height:22px;padding:0 6px;border-radius:6px;font-weight:900;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .controls{padding:2px 16px 12px;display:flex;flex-direction:column;gap:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{height:36px;min-width:44px;padding:0 12px;border-radius:18px;border:1.5px solid var(--border2);background:var(--card);font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .chip.line-chip{min-width:56px;padding:0 10px}
  .j-title{margin:0;font-weight:800;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word}
  .chip .dot{width:10px;height:10px;border-radius:5px;flex:none}
  .chip.on-dark{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .wrap-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .time-in{height:44px;border:1.5px solid var(--border2);border-radius:12px;padding:0 10px;background:var(--card);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
  .seg{display:inline-flex;background:var(--seg);border-radius:12px;padding:3px}
  .seg button{height:38px;padding:0 14px;border:0;border-radius:9px;background:none;font-weight:800;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .dep{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border:0;border-bottom:1px solid var(--line2);width:100%;background:none;text-align:left}
  button.dep:active{background:var(--line2)}
  /* parcours d'une course */
  .jrow{display:grid;grid-template-columns:66px 14px 1fr;column-gap:10px;padding:0 16px;width:100%;background:none;border:0;text-align:left}
  .jrow:active{background:var(--line2)}
  .jrow .leg-t{padding-top:10px}
  .jrow .rail .node{margin-top:14px;width:12px;height:12px}
  .jrow.past{opacity:.45}
  .jrow.here .stn{color:var(--ink)}
  .jrow .stn{font-size:15px;font-weight:700;padding:9px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .jrow.iss-skip .stn-name{text-decoration:line-through;color:var(--muted)}
  .stop-tag{font-size:11px;font-weight:900;border-radius:5px;padding:2px 6px}
  .stop-tag.skip{background:var(--bad);color:var(--on-bad)}
  .stop-tag.moved{background:var(--late);color:var(--on-bad)}
  .jrow.first .rail::before{top:18px}
  .jrow.last .rail::before{bottom:calc(100% - 18px)}
  /* tirer pour actualiser */
  #app{position:relative}
  #ptr{position:absolute;left:50%;top:0;width:40px;height:40px;margin-left:-20px;border-radius:20px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:5;color:var(--accent)}
  #ptr.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dep-to{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .to{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dep-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .big{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
  .st-ok{font-size:13px;font-weight:800;color:var(--ok)}
  .st-late{font-size:13px;font-weight:800;color:var(--late)}
  .st-early{font-size:13px;font-weight:800;color:var(--ok)}
  .st-gone{font-size:13px;font-weight:800;color:var(--bad)}
  .conn{padding:14px 16px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
  .conn-top{display:flex;align-items:baseline;justify-content:space-between}
  .big2{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .dash{color:var(--faint);font-weight:700}
  .conn-legs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ml{margin-left:auto}
  .cm{padding:16px;display:flex;flex-direction:column;gap:12px}
  .cm-title{font-size:18px;font-weight:900}
  .cm-list{display:flex;flex-direction:column;border-top:1px solid var(--line2)}
  .cm-row,.cand{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid var(--line2)}
  button.cm-row{width:100%;background:none;border:0;border-bottom:1px solid var(--line2);padding:0;text-align:left}
  button.cm-row:active{background:var(--line2)}
  .cand{padding:0 16px;cursor:pointer}
  .cand input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
  .cm-time{font-size:17px;font-weight:800;width:112px;flex:none;font-variant-numeric:tabular-nums}
  .cm-legs{flex:1;display:flex;gap:4px;flex-wrap:wrap}
  .row{display:flex;align-items:center} .gap{gap:8px} .f1{flex:1;min-width:0}
  .days{display:flex;justify-content:space-between;margin-top:8px}
  .day{width:42px;height:42px;border-radius:21px;border:1.5px solid var(--border2);background:var(--card);font-weight:900;font-size:13px}
  .day.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  /* détail d'itinéraire */
  .leg{display:grid;grid-template-columns:52px 14px 1fr;column-gap:10px;padding:0 16px}
  .leg-t{font-weight:900;font-variant-numeric:tabular-nums;font-size:16px;padding-top:12px;text-align:right}
  .leg-t .d{display:block;font-size:11px;font-weight:800;color:var(--late);white-space:nowrap}
  .leg-t .d.early{color:var(--ok)}
  .rail{position:relative;display:flex;justify-content:center}
  .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;border-radius:2px;background:var(--c,var(--border2))}
  .rail.walk::before{background:repeating-linear-gradient(to bottom,var(--faint) 0 4px,transparent 4px 9px);width:3px}
  .rail .node{position:relative;margin-top:16px;width:14px;height:14px;border-radius:7px;background:var(--card);border:3px solid var(--c,#8A8F98)}
  .leg-b{padding:10px 0 12px;min-width:0}
  .stn{font-size:16px;font-weight:800}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .mid{padding:4px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  details.pass summary{list-style:none;cursor:pointer;font-size:13px;font-weight:800;color:var(--accent);min-height:36px;display:flex;align-items:center}
  details.pass summary::-webkit-details-marker{display:none}
  details.pass ol{margin:0 0 6px;padding:0;list-style:none}
  details.pass li{display:flex;gap:10px;font-size:14px;padding:4px 0;color:var(--muted)}
  details.pass li span:first-child{width:44px;font-variant-numeric:tabular-nums;font-weight:700}
  nav{position:relative;z-index:3;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(env(safe-area-inset-bottom) + 6px)}
  .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;font-size:11.5px;font-weight:800;min-height:56px;color:var(--muted)}
  .tab.on{color:var(--accent)}
  .next{width:100%;margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}

  /* thème sombre (classe posée par le script en tête de page) */
  html.dark{
    --ground:#121316; --card:#1C1E22; --ink:#F1F1F2; --muted:#A2A7B0; --faint:#7C818B;
    --line:#2C2F35; --line2:#26292E; --accent:#F07A3A; --ok:#4ADE80; --late:#FBBF24; --bad:#F87171;
    --border2:#3A3D44; --sugg:#22252A; --seg:#2A2D33; --on-accent:#1A0F08; --on-bad:#2A0707; --bad-soft:#3A1E1E; color-scheme:dark;
  }
  html.dark #sheet .backdrop{background:rgba(0,0,0,.6)}
  html.dark .seg button.on{background:var(--border2)}
  /* carte */
  .map-screen{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
  #bigmap{flex:1;min-height:160px;background:var(--line2);z-index:0}
  html.dark #bigmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
  #bigmap .leaflet-control-attribution{font-size:9px}
  .map-search{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .map-search .sugg{max-height:46vh;overflow-y:auto}
  .map-fab{position:absolute;right:12px;z-index:900;width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .map-panel{max-height:56%;overflow-y:auto;background:var(--ground);border-radius:18px 18px 0 0;margin-top:-16px;position:relative;z-index:800;padding:12px 16px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:10px;flex-shrink:0;overscroll-behavior:contain}
  .map-panel > *{flex-shrink:0}
  .opt{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:12px 14px}
  .opt-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .tagb{font-size:11px;font-weight:900;border-radius:6px;padding:3px 7px;white-space:nowrap}
  .tagb.near{background:var(--seg);color:var(--ink)}
  .tagb.fast{background:var(--accent);color:var(--on-accent)}
  .tagb.direct{background:var(--ok);color:var(--on-bad)}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
  .stop-pin{width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
  .dest-pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--bad);border:3px solid #fff}
  .to-line{display:flex;align-items:center;gap:4px;min-width:0}
  .bell{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin:-6px 0;border-radius:16px;color:var(--faint);flex:none;cursor:pointer}
  .bell.on{color:var(--accent)}
  .bell:active{background:var(--line2)}
  .warn{display:inline-flex;align-items:center;gap:4px;width:max-content;background:var(--bad);color:var(--on-bad);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:900;cursor:pointer;margin-top:3px}
  .warn svg{flex:none}
  .alert-card{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:14px 16px}
  .alert-card .a-title{font-size:16px;font-weight:800;line-height:1.3}
  .alert-banner{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--bad);background:var(--bad-soft);color:var(--ink)}
  .alert-banner .a-title{font-weight:800;font-size:15px;line-height:1.3}
  .a-lines{display:flex;gap:4px;flex-wrap:wrap}
  .a-tag{font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--bad)}
  .a-text{font-size:15px;line-height:1.5;white-space:pre-line;margin:0}
  /* tutoriels */
  .tuto-viewer{display:flex;flex-direction:column;flex:1;min-height:0}
  .tuto-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tuto-track::-webkit-scrollbar{display:none}
  .tuto-slide{flex:0 0 100%;scroll-snap-align:center;padding:0 16px 8px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-sizing:border-box}
  .tuto-slide h2{margin:0;font-size:21px;font-weight:900;line-height:1.25}
  .tuto-slide p{margin:0;font-size:15.5px;line-height:1.5;color:var(--muted)}
  .tuto-slide p b{color:var(--ink)}
  .tuto-nav{display:flex;align-items:center;gap:10px;padding:10px 16px 14px}
  .dots{flex:1;display:flex;justify-content:center;gap:6px}
  .dots i{width:7px;height:7px;border-radius:4px;background:var(--border2);transition:width .2s,background .2s}
  .dots i.on{width:20px;background:var(--accent)}
  .mock{position:relative;background:var(--ground);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:170px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .mock .card{border-radius:12px}
  .m-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:14px}
  .m-row:last-child{border-bottom:0}
  .m-to{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:800}
  .m-to small{font-weight:600;color:var(--muted);font-size:12px}
  .m-big{font-weight:900;font-size:17px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
  .m-title{font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
  .m-field{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line2)}
  .m-field:last-child{border-bottom:0}
  .m-field .label{width:74px}
  .m-btn{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:14px}
  .tap{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--accent);opacity:.35;pointer-events:none;animation:tap 1.6s ease-out infinite}
  .tap::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--accent);opacity:1}
  @keyframes tap{0%{transform:scale(.6);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.tap{animation:none}}
  .tuto-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:0;border-bottom:1px solid var(--line2);background:none}
  .tuto-item:last-child{border-bottom:0}
  .tuto-num{width:32px;height:32px;border-radius:16px;background:var(--seg);display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
  #welcome{position:fixed;inset:0;z-index:30;background:var(--ground);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
  #welcome.open{display:flex}
  #welcome .tuto-viewer{max-width:560px;width:100%;margin:0 auto}
  .info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;border-bottom:1px solid var(--line2);font-size:15px}
  .info-row:last-child{border-bottom:0}
  .info-row a{color:var(--accent);font-weight:800;text-decoration:none;text-align:right}
  .seg button{transition:background-color .25s,color .25s}
  /* transition de thème : cercle qui s'agrandit depuis le bouton touché */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  ::view-transition-new(root){z-index:2}
  /* repli (navigateurs sans View Transitions) : fondu des couleurs */
  html.theming, html.theming *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease!important}
</style>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" aria-hidden="true"><div class="backdrop" data-sheet="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>

<script>
/* =========================================================
   Not TPG
   Temps réel : transport.opendata.ch (sans clé)
   Arrêts et couleurs : data/stops.json et data/lines.json,
   générés depuis les sources officielles (voir scripts/build-data.mjs)
   ========================================================= */
const API = 'https://transport.opendata.ch/v1';
const DAYS = ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'];
const DAYS_LONG = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const LOCAL_CATS = ['B', 'T', 'BN', 'NFB', 'NFT', 'M', 'BUS', 'TRAM', 'Bus', 'Tram', 'TN', 'BAT', 'NFO'];
const TPG_ORANGE = { bg: '#F59700', fg: '#1A1200' };
const TRAIN = { bg: '#2B2F36', fg: '#FFFFFF' };
const GE_BOX = { latMin: 46.08, latMax: 46.40, lonMin: 5.90, lonMax: 6.35 }; // secours si data/stops.json manque

const ICON = {
  target: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  pin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  locate: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
  swap: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--accent)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  up: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  walk: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-3-3 1-5 4 3h3M8 12l-2 3"/></svg>'
};

/* ---------- utilitaires ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const parseISO = (s) => (s ? new Date(String(s).replace(/([+-]\d\d)(\d\d)$/, '$1:$2')) : null);
const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const t2m = (t) => { const p = String(t || '0:0').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
const m2t = (m) => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const dmin = (d) => d.getHours() * 60 + d.getMinutes();
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dayIdx = (d) => (d.getDay() + 6) % 7;
const short = (n) => String(n || '').replace(/^Genève,\s*/, '');
const fold = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const todayStr = () => ymd(new Date());
function dateLabel(str) {
  if (!str || str === todayStr()) return 'aujourd’hui';
  const d = new Date(str + 'T12:00:00');
  return DAYS_LONG[dayIdx(d)] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* Correction d'heure : depuis le passage à l'heure d'hiver, l'API horaire décale d'une heure
   les heures qu'on lui demande. On mesure ce décalage sur un arrêt très desservi (Bel-Air)
   et on le compense dans toutes les requêtes. Si l'API est corrigée, le décalage revient à 0. */
let API_SHIFT = 0;
const shiftReady = (async () => {
  const saved = store.get('nt_api_shift', null);
  if (saved && Date.now() - saved.at < 3600e3) { API_SHIFT = saved.v; return; }
  try {
    const now = new Date();
    const r = await fetch(`${API}/stationboard?id=8587387&limit=6&datetime=${encodeURIComponent(ymd(now) + ' ' + hm(now))}`);
    const j = await r.json();
    const first = Math.min(...(j.stationboard || []).map((d) => parseISO(d.stop.departure).getTime()));
    if (!isFinite(first)) return;
    const diff = Math.round((first - now.getTime()) / 60000);
    const v = diff >= 45 && diff <= 75 ? -60 : diff <= -45 && diff >= -75 ? 60 : diff >= -15 && diff <= 20 ? 0 : null;
    if (v === null) { if (saved) API_SHIFT = saved.v; return; } // mesure peu fiable (nuit) : on garde la dernière valeur
    API_SHIFT = v;
    store.set('nt_api_shift', { v, at: Date.now() });
  } catch {}
})();
function shiftPath(path) {
  if (!API_SHIFT) return path;
  const move = (dateStr, timeStr) => { const d = new Date(dateStr + 'T' + timeStr); d.setMinutes(d.getMinutes() + API_SHIFT); return [ymd(d), hm(d)]; };
  path = path.replace(/datetime=([^&]+)/, (m, v) => {
    const [ds, ts] = decodeURIComponent(v).split(' ');
    if (!ts) return m;
    const [a, b] = move(ds, ts); return 'datetime=' + encodeURIComponent(a + ' ' + b);
  });
  return path; // les liaisons (/connections) ne sont pas touchées par ce décalage
}
async function api(path) {
  if (path.startsWith('/stationboard') && /datetime=/.test(path)) { await shiftReady; path = shiftPath(path); }
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- données tpg (arrêts, couleurs) ---------- */
let STOPS = null; // [{id,name,lat,lon,k,f,w,l}]
let LINES = {};   // { "12": {bg, fg} }
const dataReady = Promise.all([
  fetch('data/stops.json').then((r) => (r.ok ? r.json() : null)).then((j) => {
    if (!j || !Array.isArray(j.stops)) return;
    STOPS = j.stops.map((s) => {
      const f = fold(s.name);
      const local = fold(s.name.includes(',') ? s.name.slice(s.name.indexOf(',') + 1) : s.name);
      return Object.assign({}, s, { f, w: f.split(' '), l: local, c: f.replace(/ /g, '') });
    });
  }).catch(() => {}),
  fetch('data/lines.json').then((r) => (r.ok ? r.json() : null)).then((j) => { if (j && j.lines) LINES = j.lines; }).catch(() => {})
]);

function searchStops(q) {
  const tokens = fold(q).split(' ').filter(Boolean);
  if (!tokens.length) return [];
  const qc = tokens.join('');
  return STOPS
    .filter((s) => tokens.every((t) => s.w.some((w) => w.startsWith(t))) || (qc.length >= 5 && s.c.includes(qc)))
    .map((s) => ({ s, score: (s.l.startsWith(tokens[0]) ? 0 : 1000) + (s.f.startsWith('geneve') ? 0 : 100) + s.name.length }))
    .sort((a, b) => a.score - b.score).slice(0, 8).map((x) => x.s);
}
const inGeneva = (lat, lon) => lat >= GE_BOX.latMin && lat <= GE_BOX.latMax && lon >= GE_BOX.lonMin && lon <= GE_BOX.lonMax;
function distM(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const x = (d - b) * r * Math.cos(((a + c) / 2) * r), y = (c - a) * r;
  return Math.sqrt(x * x + y * y) * R;
}

function lineStyle(cat, num) {
  const key = String(num || '').toUpperCase();
  if (!cat || LOCAL_CATS.includes(cat)) return LINES[key] || TPG_ORANGE;
  return TRAIN;
}
function badge(cat, num, small) {
  const s = lineStyle(cat, num);
  return `<span class="${small ? 'badge-sm' : 'badge'}" style="background:${s.bg};color:${s.fg}">${esc(num || cat || '?')}</span>`;
}

/* ---------- état ---------- */
let favs = store.get('nt_favs', []);
let filters = store.get('nt_filters', {});
let commutes = store.get('nt_commutes', []);
const S = {
  screen: 'home', stop: null, fromText: '', toText: '', geo: null, editFavs: false,
  boardDate: '', boardTime: '', board: [], draft: null, q: null, res: [], trip: null, resLoading: false
};
const statusCache = {};
let boardTimer = null;
const main = $('#main');

/* ---------- liaisons ---------- */
function mapConn(c) {
  const dep = parseISO(c.from.departure), arr = parseISO(c.to.arrival);
  const legs = (c.sections || []).filter((s) => s.journey).map((s) => ({ cat: s.journey.category, num: s.journey.number }));
  return {
    dep, arr, depStr: hm(dep), arrStr: hm(arr), dur: Math.round((arr - dep) / 60000),
    transfers: c.transfers || 0, legs, key: legs.map((l) => l.num || l.cat).join('+'), delay: c.from.delay || 0, raw: c
  };
}
function connQuery(o) {
  let q = `/connections?from=${encodeURIComponent(o.from)}&to=${encodeURIComponent(o.to)}&date=${o.date}&time=${o.time}&limit=${o.limit || 6}`;
  if (o.arrival) q += '&isArrivalTime=1';
  if (o.direct) q += '&direct=1';
  if (o.modes) {
    const on = Object.keys(o.modes).filter((k) => o.modes[k]);
    if (on.length && on.length < Object.keys(o.modes).length) on.forEach((m) => { q += '&transportations%5B%5D=' + m; });
  }
  return q;
}
async function getConns(from, to, date, time, limit = 6) {
  const j = await api(connQuery({ from, to, date, time, limit }));
  return (j.connections || []).map(mapConn);
}
async function connsInWindow(from, to, date, start, end) {
  const out = []; let time = start; const s = t2m(start), e = t2m(end);
  for (let i = 0; i < 4; i++) {
    const list = await getConns(from, to, date, time, 16);
    if (!list.length) break;
    for (const c of list) {
      if (ymd(c.dep) !== date) continue;
      const m = dmin(c.dep);
      if (m >= s && m <= e && !out.some((o) => o.depStr === c.depStr && o.key === c.key)) out.push(c);
    }
    const last = list[list.length - 1];
    if (ymd(last.dep) !== date || dmin(last.dep) >= e) break;
    const nextT = dmin(last.dep) + 1;
    if (nextT <= t2m(time)) break; // sécurité : on n'avance plus
    time = m2t(nextT);
  }
  return out.sort((a, b) => a.dep - b.dep);
}
function nextDate(days) {
  const d = new Date();
  for (let i = 0; i < 7; i++) { if (days.includes(dayIdx(d))) return d; d.setDate(d.getDate() + 1); }
  return new Date();
}
const todayIn = (cm) => cm.days.includes(dayIdx(new Date()));
function daysLabel(ds) {
  const s = ds.slice().sort();
  if (s.join() === '0,1,2,3,4') return 'Lu–Ve';
  if (s.length === 7) return 'Tous les jours';
  return s.map((i) => DAYS[i]).join(' ');
}
async function commuteStatus(cm) {
  if (!todayIn(cm)) return null;
  const k = cm.id + '|' + todayStr(); const c = statusCache[k];
  if (c && Date.now() - c.at < 60000) return c.list;
  const list = await connsInWindow(cm.from, cm.to, todayStr(), cm.start, cm.end);
  statusCache[k] = { at: Date.now(), list };
  return list;
}
function statusOf(p, list) {
  if (!list) return null;
  const m = list.find((c) => c.depStr === p.dep && c.key === p.key)
    || list.find((c) => c.key === p.key && Math.abs(dmin(c.dep) - t2m(p.dep)) <= 3);
  if (!m) return { text: 'Introuvable', cls: 'st-gone' };
  if (m.delay > 0) return { text: '+' + m.delay + ' min', cls: 'st-late' };
  return { text: 'À l’heure', cls: 'st-ok' };
}

/* ---------- suggestions d'arrêts (réseau tpg uniquement) ---------- */
function kindLabel(k) { return k && k.includes('t') ? 'Tram' : k && k.includes('n') ? 'Bateau' : 'Bus'; }
function attachSuggest(input, box, onPick) {
  let t;
  const show = (list) => {
    box.innerHTML = list.map((s) => `<button type="button" class="sugg-item" data-id="${esc(s.id)}" data-name="${esc(s.name)}">
      <span>${esc(s.name)}</span>${s.k ? `<span class="kind">${kindLabel(s.k)}</span>` : ''}</button>`).join('');
  };
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 2) { box.innerHTML = ''; return; }
    if (STOPS) { show(searchStops(q)); return; }
    t = setTimeout(async () => {
      try {
        const j = await api(`/locations?type=station&query=${encodeURIComponent(q)}`);
        show((j.stations || []).filter((s) => s.id && s.name && s.coordinate && inGeneva(s.coordinate.x, s.coordinate.y) && s.icon !== 'train').slice(0, 8));
      } catch { box.innerHTML = ''; }
    }, 250);
  });
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.sugg-item'); if (!b) return;
    box.innerHTML = '';
    onPick({ id: b.dataset.id, name: b.dataset.name });
  });
}

/* ---------- navigation ---------- */
const SUB = ['board', 'results', 'trip', 'new', 'journey', 'tutos', 'tuto'];
const PARENT = { new: 'commutes', trip: 'results', journey: 'board', tutos: 'settings', tuto: 'tutos' };
const parentOf = (screen) => (screen === 'trip' && S.tripParent ? S.tripParent : screen === 'board' && S.boardParent ? S.boardParent : PARENT[screen] || 'home');
function go(screen, push = true) {
  clearTimeout(boardTimer);
  closeSheet();
  if (push && SUB.includes(screen)) history.pushState({ s: screen }, '');
  S.screen = screen;
  const tab = screen === 'commutes' || screen === 'new' ? 'commutes' : screen === 'tutos' || screen === 'tuto' ? 'settings' : ['settings', 'infos', 'map'].includes(screen) ? screen : screen === 'trip' && S.tripParent === 'map' || screen === 'board' && S.boardParent === 'map' ? 'map' : 'home';
  $('#tabHome').classList.toggle('on', tab === 'home');
  $('#tabCommutes').classList.toggle('on', tab === 'commutes');
  $('#tabSettings').classList.toggle('on', tab === 'settings');
  $('#tabMap').classList.toggle('on', tab === 'map');
  $('#tabInfos').classList.toggle('on', tab === 'infos');
  ({ home: renderHome, board: renderBoard, results: renderResults, trip: renderTrip, commutes: renderCommutes, new: renderNew, journey: renderJourney, settings: renderSettings, infos: renderInfos, tutos: renderTutos, tuto: renderTuto, map: renderMap })[screen]();
}
window.addEventListener('popstate', () => go(parentOf(S.screen), false));
document.querySelector('nav').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  go(b.dataset.tab, false);
});
const backBtn = () => `<button class="icon-btn" data-act="back" aria-label="Retour">${ICON.back}</button>`;

const FAV_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
/* Affichage des départs : 'min' (minutes restantes, retard inclus) ou 'time' (heure prévue + écart) */
const depMode = () => store.get('nt_depmode', 'min');
const fmtDelta = (delta) => (delta > 0 ? '+' : '−') + Math.abs(delta);
/* ---------- CARTE ---------- */
let leafletP = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => resolve(window.L);
    js.onerror = () => { leafletP = null; reject(new Error('leaflet')); };
    document.head.appendChild(js);
  });
  return leafletP;
}
const GENEVA = [46.2044, 6.1432];
const M = { map: null, layers: null, origin: null, originAuto: true, dest: null, results: null, sel: null, loading: false, err: null, watch: null, walkStop: null };
const WALK_MS = 1.25; // vitesse de marche (m/s), pour les estimations
const MARGIN = 180; // arriver à l'arrêt 3 min avant le bus
const estWalk = (a, b) => Math.round((distM(a[0], a[1], b[0], b[1]) * 1.3) / WALK_MS); // secondes
const minsTxt = (sec) => Math.max(1, Math.round(sec / 60)) + ' min';
const pinIcon = (cls, html = '') => window.L.divIcon({ className: '', html: `<div class="${cls}">${html}</div>`, iconSize: [20, 20], iconAnchor: [10, 10] });

async function walkApi(action, params) {
  const r = await fetch('/api/walk?action=' + action + '&' + new URLSearchParams(params));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}
function nearestStops(pt, n, maxM) {
  if (!STOPS) return [];
  return STOPS.map((s) => ({ s, d: distM(pt[0], pt[1], s.lat, s.lon) })).filter((x) => x.d <= maxM)
    .sort((a, b) => a.d - b.d).slice(0, n);
}

function renderMap() {
  S.boardParent = null;
  main.innerHTML = `
    <div class="map-screen">
      <div class="card map-search">
        <label class="field" style="min-height:50px">${ICON.pin}<input id="mapDest" placeholder="Où veux-tu aller ?" value="${esc(M.dest ? M.dest.label : '')}" autocomplete="off" aria-label="Destination">
          ${M.dest ? '<button class="icon-btn" data-act="mapClear" aria-label="Effacer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--muted)"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' : ''}</label>
        <div class="sugg" id="mapSugg"></div>
      </div>
      <div id="bigmap" role="application" aria-label="Carte"></div>
      <button class="map-fab" data-act="mapLocate" aria-label="Me localiser" style="top:calc(env(safe-area-inset-top) + 76px)">${ICON.locate}</button>
      <div class="map-panel" id="mapPanel"></div>

  attachPlaceSearch($('#mapDest'), $('#mapSugg'), (place) => {

async function initBigMap() {
  let L;
  try { L = await loadLeaflet(); } catch { const p = $('#mapPanel'); if (p) p.insertAdjacentHTML('afterbegin', '<p class="small">Impossible de charger la carte.</p>'); return; }
  const el = $('#bigmap'); if (!el || !document.body.contains(el)) return;
  if (M.map) { try { M.map.remove(); } catch {} }
  const map = L.map(el, { zoomControl: false, attributionControl: true, tap: true });
  M.map = map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  M.layers = L.layerGroup().addTo(map);
  map.setView(M.origin || GENEVA, M.origin ? 16 : 13);
  map.on('click', (e) => {
    if (M.originAuto && M.origin) return; // position GPS : on ne la remplace pas par un simple tap
    M.origin = [e.latlng.lat, e.latlng.lng]; M.originAuto = false;
    toast('Point de départ placé.'); M.results = null; M.sel = null;
    drawMapLayers(); drawMapPanel(); if (M.walkStop) walkToStop(); else if (M.dest) mapPlan();
  });
  setTimeout(() => map.invalidateSize(), 50);
  drawMapLayers();
  if (!M.origin) mapLocate(true);
  else if (M.walkStop) walkToStop();
}

function mapLocate(silent) {
  if (!navigator.geolocation) { if (!silent) toast('Localisation indisponible.'); return; }
  navigator.geolocation.getCurrentPosition((pos) => {
    M.origin = [pos.coords.latitude, pos.coords.longitude]; M.originAuto = true;
    store.set('nt_geo_denied', false);
    if (M.map) M.map.setView(M.origin, Math.max(M.map.getZoom(), 16));
    M.results = null; M.sel = null;
    drawMapLayers(); drawMapPanel();
    if (M.walkStop) walkToStop(); else if (M.dest) mapPlan();
  }, (err) => {
    if (err && err.code === 1) store.set('nt_geo_denied', true);
    M.err = err && err.code === 1 ? 'denied' : 'unavailable';
    drawMapPanel();
    if (!silent) toast(err && err.code === 1 ? 'Localisation bloquée : Réglages → Autorisations.' : 'Position introuvable.');
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

function drawMapLayers() {
  const L = window.L; if (!M.map || !L) return;
  M.layers.clearLayers();
  const bounds = [];
  if (M.origin) { L.marker(M.origin, { icon: pinIcon('me-dot'), interactive: false, zIndexOffset: 1000 }).addTo(M.layers); bounds.push(M.origin); }
  // Arrêts proches (cliquables : ouvrent les départs)
  const near = M.origin ? nearestStops(M.origin, 12, 700) : [];
  const shown = new Set();
  for (const { s } of near) {
    shown.add(s.id);
    const sel = M.sel && M.sel.stop.id === s.id;
    L.marker([s.lat, s.lon], { icon: pinIcon('stop-pin', ''), opacity: M.sel && !sel ? 0.45 : 1 })
      .bindTooltip(short(s.name), { direction: 'top', offset: [0, -8] })
      .on('click', () => { const r = M.results && M.results.find((x) => x.stop.id === s.id); if (r) mapSelect(r); else openStopBoard(s); })
      .addTo(M.layers);
  }
  if (M.results) for (const r of M.results) if (!shown.has(r.stop.id)) {
    L.marker([r.stop.lat, r.stop.lon], { icon: pinIcon('stop-pin') }).on('click', () => mapSelect(r)).addTo(M.layers);
  }
  if (M.dest) { L.marker([M.dest.lat, M.dest.lon], { icon: pinIcon('dest-pin'), interactive: false }).addTo(M.layers); bounds.push([M.dest.lat, M.dest.lon]); }
  if (M.sel) {
    const st = [M.sel.stop.lat, M.sel.stop.lon];
    const path = M.sel.walk && M.sel.walk.coords ? M.sel.walk.coords : [M.origin, st];
    L.polyline(path, { color: '#2563EB', weight: 5, opacity: 0.85, dashArray: M.sel.walk && M.sel.walk.coords ? null : '2 9', lineCap: 'round' }).addTo(M.layers);
    const c = lineStyle(M.sel.first.cat, M.sel.first.num);
    L.marker(st, { icon: window.L.divIcon({ className: '', html: `<span class="badge-sm" style="background:${c.bg};color:${c.fg};box-shadow:0 0 0 3px #fff">${esc(M.sel.first.num || '')}</span>`, iconSize: [30, 22], iconAnchor: [15, 11] }), zIndexOffset: 900 }).addTo(M.layers);
    M.map.fitBounds(L.latLngBounds(path.concat([st])), { padding: [70, 40], maxZoom: 18 });
  } else if (M.walkStop && M.origin) {
    const w = M.walkStop, st = [w.stop.lat, w.stop.lon];
    const path = w.route && w.route.coords ? w.route.coords : [M.origin, st];
    L.polyline(path, { color: '#2563EB', weight: 5, opacity: 0.85, dashArray: w.route ? null : '2 9', lineCap: 'round' }).addTo(M.layers);
    L.marker(st, { icon: pinIcon('dest-pin'), interactive: false, zIndexOffset: 900 }).addTo(M.layers);
    M.map.fitBounds(L.latLngBounds(path.concat([st])), { padding: [70, 40], maxZoom: 18 });
  } else if (M.results && M.results.length && M.origin) {
    M.map.fitBounds(L.latLngBounds([M.origin, ...M.results.map((r) => [r.stop.lat, r.stop.lon])]), { padding: [80, 40], maxZoom: 17 });
  }
}

// Recherche : arrêts tpg (liste locale) + adresses et lieux (Photon / OpenStreetMap)
function attachPlaceSearch(input, box, onPick) {
  let t, seq = 0;
  const render = (stops, places) => {
    box.innerHTML = stops.map((s) => `<button type="button" class="sugg-item" data-k="s" data-id="${esc(s.id)}"><span>${esc(s.name)}</span><span class="kind">Arrêt</span></button>`).join('') +
      places.map((p, i) => `<button type="button" class="sugg-item" data-k="p" data-i="${i}"><span style="display:flex;flex-direction:column"><span>${esc(p.title)}</span><span class="small" style="font-weight:600">${esc(p.sub)}</span></span><span class="kind">${esc(p.kind)}</span></button>`).join('');
    box._places = places;
  };
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 2) { box.innerHTML = ''; return; }
    const stops = STOPS ? searchStops(q).slice(0, 4) : [];
    render(stops, box._places && box._q && q.startsWith(box._q) ? box._places : []);
    if (q.length < 3) return;
    const my = ++seq;
    t = setTimeout(async () => {
      try {
        const c = M.origin || GENEVA;
        const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=fr&limit=6&lat=${c[0]}&lon=${c[1]}&bbox=5.85,46.05,6.4,46.45`);
        const j = await r.json();
        if (my !== seq) return;
        const places = (j.features || []).map((f) => {
          const p = f.properties || {}, [lon, lat] = f.geometry.coordinates;
          const street = [p.street, p.housenumber].filter(Boolean).join(' ');
          const title = p.name || street || p.city || '';
          const sub = [p.name && street ? street : '', p.postcode, p.city || p.locality || p.district].filter(Boolean).join(', ');
          const kind = p.osm_key === 'place' || p.type === 'street' ? 'Rue' : p.housenumber ? 'Adresse' : 'Lieu';
          return { title, sub, kind, lat, lon };
        }).filter((p) => p.title);
        box._q = q;
        render(STOPS ? searchStops(q).slice(0, 4) : [], places);
      } catch {}
    }, 350);
  });
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.sugg-item'); if (!b) return;
    box.innerHTML = '';
    if (b.dataset.k === 's') { const s = stopById(b.dataset.id); if (s) onPick({ label: short(s.name), lat: s.lat, lon: s.lon, stopId: s.id }); }
    else { const p = box._places[+b.dataset.i]; onPick({ label: p.title + (p.sub ? ', ' + p.sub.split(',').pop().trim() : ''), lat: p.lat, lon: p.lon }); }
  });
}

// Calcule, pour chaque arrêt proche, la meilleure liaison jusqu'à la destination
async function mapPlan(force) {
  if (!M.origin || !M.dest || M.loading) return;
  if (M.results && !force) return;
  M.loading = true; M.sel = null; drawMapPanel();
  try {
    const dest = [M.dest.lat, M.dest.lon];
    const directWalk = estWalk(M.origin, dest);
    // Arrêts d'arrivée : l'arrêt choisi, ou les 2 arrêts les plus proches de l'adresse
    const destStops = M.dest.stopId ? [{ s: stopById(M.dest.stopId), d: 0 }] : nearestStops(dest, 2, 900);
    let origins = nearestStops(M.origin, 6, 800);
    if (origins.length < 3) origins = nearestStops(M.origin, 4, 1600);
    if (!origins.length || !destStops.length) { M.results = []; M.walkOnly = directWalk; return; }
    // Temps à pied réels (OpenRouteService), sinon estimation
    let walks = origins.map((o) => estWalk(M.origin, [o.s.lat, o.s.lon])), real = false;
    try {
      const j = await walkApi('matrix', { from: M.origin.join(','), to: origins.map((o) => o.s.lat + ',' + o.s.lon).join('|') });
      if (j.durations && j.durations.every((x) => x != null)) { walks = j.durations.map(Math.round); real = true; }
    } catch {}
    origins = origins.map((o, i) => ({ ...o, walk: walks[i] })).sort((a, b) => a.walk - b.walk).slice(0, 4);
    const now = Date.now();
    const results = [];
    await Promise.all(origins.map(async (o) => {
      let best = null;
      for (const ds of destStops) {
        if (!ds.s) continue;
        const endWalk = M.dest.stopId ? 0 : estWalk([ds.s.lat, ds.s.lon], dest);
        if (ds.s.id === o.s.id) continue;
        const t = new Date(now + (o.walk + MARGIN) * 1000);
        try {
          const j = await api(connQuery({ from: o.s.id, to: ds.s.id, date: ymd(t), time: hm(t), limit: 3 }));
          for (const c of (j.connections || []).map(mapConn)) {
            // L'API propose parfois de marcher d'abord vers un autre arrêt : on ne garde que les
            // liaisons qui partent vraiment en bus/tram de cet arrêt
            const s0 = (c.raw.sections || [])[0];
            if (!s0 || !s0.journey) continue;
            if (c.dep.getTime() < now + (o.walk + MARGIN) * 1000) continue;
            const arrive = c.arr.getTime() + endWalk * 1000;
            if (!best || arrive < best.arrive) best = { c, arrive, endWalk, destStop: ds.s };
          }
        } catch {}
      }
      if (best) {
        const firstSec = (best.c.raw.sections || []).find((x) => x.journey);
        const first = firstSec ? { cat: firstSec.journey.category, num: firstSec.journey.number, to: firstSec.journey.to } : { cat: '', num: '', to: '' };
        results.push({ stop: o.s, walk: o.walk, walkReal: real, ...best, first });
      }
    }));
    results.sort((a, b) => a.arrive - b.arrive);
    if (results.length) {
      results[0].fast = true;
      const minWalk = Math.min(...results.map((r) => r.walk));
      results.forEach((r) => { if (r.walk === minWalk) r.near = true; if (!r.c.transfers) r.direct = true; });
    }
    M.results = results;
    M.walkOnly = results.length && now + directWalk * 1000 <= results[0].arrive ? directWalk : (!results.length ? directWalk : null);
  } finally {
    M.loading = false;
    if (S.screen === 'map') { drawMapPanel(); drawMapLayers(); }
  }
}

// « Quitte ta position dans X min » (marche + 3 min de marge avant le bus)
function leaveTxt(dep, walkSec) {
  const m = Math.round((dep.getTime() - (walkSec + MARGIN) * 1000 - Date.now()) / 60000);
  return m <= 0 ? '<b>pars maintenant</b>' : `pars dans <b>${m} min</b>`;
}
// « Y aller » : itinéraire à pied jusqu'à un arrêt, puis ses prochains départs
async function walkToStop() {
  const w = M.walkStop; if (!w || !M.origin) return;
  w.route = null; w.deps = null; drawMapPanel(); drawMapLayers();
  try { w.route = await walkApi('route', { from: M.origin.join(','), to: w.stop.lat + ',' + w.stop.lon }); } catch { w.route = null; w.failed = true; }
  if (M.walkStop !== w) return;
  drawMapLayers(); drawMapPanel();
  const sec = w.route ? w.route.duration : estWalk(M.origin, [w.stop.lat, w.stop.lon]);
  try {
    const t = new Date(Date.now() + sec * 1000);
    const j = await api(`/stationboard?id=${encodeURIComponent(w.stop.id)}&limit=12&datetime=${encodeURIComponent(ymd(t) + ' ' + hm(t))}`);
    w.deps = j.stationboard || [];
  } catch { w.deps = []; }
  if (M.walkStop === w && S.screen === 'map') drawMapPanel();
}
function drawWalkPanel(p) {
  const w = M.walkStop, now = Date.now();
  if (!M.origin) { p.innerHTML = `<p style="margin:0;font-weight:800">${esc(short(w.stop.name))}</p><p class="small" style="margin:0">${M.err === 'denied' ? 'Localisation bloquée : touche la carte pour placer ton point de départ, ou réactive-la dans Réglages → Autorisations.' : 'Recherche de ta position…'}</p>`; return; }
  const sec = w.route ? w.route.duration : estWalk(M.origin, [w.stop.lat, w.stop.lon]);
  const dist = w.route ? Math.round(w.route.distance) : Math.round(distM(M.origin[0], M.origin[1], w.stop.lat, w.stop.lon) * 1.3);
  const arrive = new Date(now + sec * 1000);
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const nav = ios ? `https://maps.apple.com/?saddr=${M.origin.join(',')}&daddr=${w.stop.lat},${w.stop.lon}&dirflg=w`
    : `https://www.google.com/maps/dir/?api=1&origin=${M.origin.join(',')}&destination=${w.stop.lat},${w.stop.lon}&travelmode=walking`;
  const deps = w.deps === null ? '<p class="empty">Chargement…</p>' : w.deps.length ? w.deps.slice(0, 8).map((d) => {
    const planned = parseISO(d.stop.departure);
    const prog = parseISO(d.stop.prognosis && d.stop.prognosis.departure);
    const real = prog || new Date(planned.getTime() + (d.stop.delay || 0) * 60000);
    const ok = real.getTime() >= arrive.getTime() + MARGIN * 1000;
    const diff = Math.round((real - now) / 60000);
    return `<div class="dep" style="${ok ? '' : 'opacity:.5'}">${badge(d.category, d.number)}<div class="dep-to"><span class="to">${esc(short(d.to))}</span><span class="small">${ok ? 'Prévu ' + hm(planned) : 'Trop tôt pour l’attraper'}${d.stop.platform ? ' · quai ' + esc(d.stop.platform) : ''}</span></div><div class="dep-r"><span class="big">${diff <= 59 ? (diff <= 0 ? 'Imm.' : diff + ' min') : hm(real)}</span></div></div>`;
  }).join('') : '<p class="empty">Aucun départ trouvé.</p>';
  p.innerHTML = `
    <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px">
      <div class="small" style="font-weight:800;color:var(--accent)">À pied jusqu’à l’arrêt</div>
      <div style="font-weight:900;font-size:18px">${esc(short(w.stop.name))}</div>
      <div style="display:flex;align-items:center;gap:6px;font-weight:800">${ICON.walk}${minsTxt(sec)} · ${dist} m · arrivée vers ${hm(arrive)}</div>
      ${w.route ? '' : `<div class="small">${w.failed ? 'Chemin par les rues indisponible : trajet estimé à vol d’oiseau.' : 'Calcul du chemin…'}</div>`}
      <div class="row gap"><a class="primary" href="${nav}" target="_blank" rel="noopener" style="flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;height:44px">Guidage GPS</a>
        <button class="ghost" data-act="mapStop" data-id="${esc(w.stop.id)}" style="height:44px">Départs</button></div>
    </div>
    <h2 class="label" style="margin:4px 4px 0">Départs à ton arrivée</h2>
    <div class="card list">${deps}</div>`;
}
function drawMapPanel() {
  const p = $('#mapPanel'); if (!p) return;
  if (M.walkStop) return drawWalkPanel(p);
  if (M.sel) return drawSelPanel(p);
  let html = '';
  if (!M.origin) {
    html = M.err === 'denied'
      ? `<p style="margin:0;font-weight:800">Localisation bloquée</p><p class="small" style="margin:0">Touche la carte pour placer ton point de départ, ou réactive la localisation dans <b>Réglages → Autorisations</b>.</p>`
      : `<p class="small" style="margin:0">Recherche de ta position… Tu peux aussi <b>toucher la carte</b> pour placer ton point de départ.</p>`;
  } else if (!M.dest) {
    const near = nearestStops(M.origin, 4, 700);
    html = `<h2 class="label" style="margin:0">Arrêts à proximité</h2>` + (near.length
      ? `<div class="card list">${near.map(({ s, d }) => `<button class="row-btn" data-act="mapStop" data-id="${esc(s.id)}"><span style="display:flex;flex-direction:column"><span>${esc(short(s.name))}</span><span class="small">${Math.round(d)} m · ~${minsTxt(d * 1.3 / WALK_MS)} à pied</span></span>${ICON.chev}</button>`).join('')}</div>`
      : '<p class="small" style="margin:0">Aucun arrêt tpg à moins de 700 m.</p>') +
      '<p class="small" style="margin:0">Cherche une destination en haut pour voir les meilleures options depuis ici.</p>';
  } else if (M.loading) {
    html = '<p class="empty" style="padding:8px 0">Recherche des meilleures options…</p>';
  } else if (M.results) {
    const walkCard = M.walkOnly ? `<div class="card opt"><div class="opt-top"><span style="font-weight:800">À pied</span><span class="tagb near">Sans transport</span></div><span class="small">${minsTxt(M.walkOnly)} de marche · arrivée vers ${hm(new Date(Date.now() + M.walkOnly * 1000))}</span></div>` : '';
    html = `<div class="opt-top"><h2 class="label" style="margin:0">Depuis ici → ${esc(M.dest.label)}</h2><button class="link" data-act="mapRefresh" style="min-height:32px">Actualiser</button></div>` +
      (M.results.length ? M.results.map((r, i) => {
        const wait = Math.max(0, Math.round((r.c.dep - Date.now()) / 60000));
        const tags = [r.fast ? '<span class="tagb fast">+ rapide</span>' : '', r.near ? '<span class="tagb near">+ proche</span>' : '', r.direct ? '<span class="tagb direct">Direct</span>' : ''].join('');
        return `<button class="card opt" data-act="mapSel" data-i="${i}">
          ${tags.trim() ? `<div style="display:flex;gap:4px;flex-wrap:wrap">${tags}</div>` : ''}
          <span style="font-weight:900;font-size:16px;line-height:1.25">${esc(short(r.stop.name))}</span>
          <div class="conn-legs">${r.c.legs.map((l) => badge(l.cat, l.num, true)).join('')}<span class="small">${r.c.legs.length ? 'Le ' + esc(r.c.legs[0].num || '') + ' part' : 'Départ'} à <b>${r.c.depStr}</b> (dans ${wait} min)</span></div>
          <div class="small">${r.walkReal ? '' : '~'}${minsTxt(r.walk)} à pied · ${leaveTxt(r.c.dep, r.walk)}</div>
          <div class="small">Arrivée <b>${hm(new Date(r.arrive))}</b>${r.c.transfers ? ' · ' + r.c.transfers + ' changement' + (r.c.transfers > 1 ? 's' : '') : ' · direct'}</div>
        </button>`;
      }).join('') : '<div class="card empty-card">Aucune liaison trouvée depuis les arrêts proches.</div>') + walkCard;
  }
  p.innerHTML = html;
}

async function mapSelect(r) {
  M.sel = { ...r, walkBase: r.walk, walk: null, deps: null };
  if (!M.originLabel || M.originLabelFor !== M.origin.join(',')) {
    const key = M.origin.join(',');
    fetch(`https://photon.komoot.io/reverse?lat=${M.origin[0]}&lon=${M.origin[1]}&lang=fr`).then((x) => x.json()).then((j) => {

  walkApi('route', { from: M.origin.join(','), to: r.stop.lat + ',' + r.stop.lon })
    .then((w) => { if (M.sel === sel) { sel.walk = w; drawMapLayers(); drawMapPanel(); } }).catch(() => {});

async function fillNext() {
  const el = $('#nextCard'); if (!el) return;
  const now = new Date(), nm = dmin(now), di = dayIdx(now);
  let best = null;
  for (const cm of commutes) {
    if (!cm.days.includes(di)) continue;
    for (const p of cm.picks) {
      const m = t2m(p.dep);
      if (m >= nm - 1 && m <= nm + 180 && (!best || m < t2m(best.p.dep))) best = { cm, p };
    }
  }
  if (!best) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="card next">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">

// silent : au démarrage, pas de message si la position n'est pas disponible
async function locate(opts = {}) {
  if (!navigator.geolocation) { if (!opts.silent) toast('Localisation indisponible sur cet appareil.'); return Promise.resolve('unsupported'); }
  return new Promise((resolve) => navigator.geolocation.getCurrentPosition(async (pos) => {
    resolve('ok');
    store.set('nt_geo_denied', false);
    const { latitude: lat, longitude: lon } = pos.coords;
    await dataReady;
    let s = null;
    if (STOPS) {
      let best = Infinity;
      for (const x of STOPS) { const d = distM(lat, lon, x.lat, x.lon); if (d < best) { best = d; s = x; } }
      if (best > 3000) s = null;
    } else {
      try {
        const j = await api(`/locations?type=station&x=${lat}&y=${lon}`);
        s = (j.stations || []).find((x) => x.id && x.name && x.icon !== 'train');
      } catch {}
    }
    if (s) { S.geo = { id: s.id, name: s.name }; S.fromText = ''; if (S.screen === 'home') renderHome(); }
  }, (err) => {
    const code = err && err.code;
    const msg = code === 1 ? 'Localisation bloquée. Pour la réactiver : Réglages → Autorisations.'
      : code === 2 ? 'Position introuvable : vérifie que la localisation du téléphone est activée.'
      : 'La position met trop de temps à arriver. Réessaie dans un instant.';
    if (code === 1) store.set('nt_geo_denied', true);
    if (!opts.silent || code === 1 && !store.get('nt_geo_warned', false)) { toast(msg); if (code === 1) store.set('nt_geo_warned', true); }
    resolve(code === 1 ? 'denied' : code === 2 ? 'unavailable' : 'timeout');
    if (S.screen === 'settings') renderSettings();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }));
}

function reloadBoard() { S.boardBefore = []; S.boardAfter = []; const d = $('#deps'); if (d) d.innerHTML = '<p class="empty">Chargement…</p>'; loadBoard(); }
const depKey = (d) => d.stop.departure + '|' + (d.number || d.category) + '|' + d.to;
function boardAll() {
  const seen = new Set(), out = [];
  for (const d of [...(S.boardBefore || []), ...S.board, ...(S.boardAfter || [])]) {
    const k = depKey(d); if (seen.has(k)) continue; seen.add(k); out.push(d);
  }
  return out.sort((a, b) => parseISO(a.stop.departure) - parseISO(b.stop.departure));

async function boardMore(dir, btn) {
  if (btn.disabled) return;
  const all = boardAll(); if (!all.length) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Chargement…';
  const edge = parseISO((dir === 'before' ? all[0] : all[all.length - 1]).stop.departure);
  const from = new Date(edge.getTime() + (dir === 'before' ? -60 : 1) * 60000);
  try {
    const j = await api(`/stationboard?id=${encodeURIComponent(S.stop.id)}&limit=60&datetime=${encodeURIComponent(ymd(from) + ' ' + hm(from))}`);
    const list = j.stationboard || [];
    const sc = $('#boardScroll'), h0 = sc ? sc.scrollHeight : 0;
    if (dir === 'before') {
      const add = list.filter((d) => parseISO(d.stop.departure) < edge);
      if (!add.length) toast('Pas de départ plus tôt trouvé.');
      S.boardBefore = add.concat(S.boardBefore || []);
      drawBoard();
      if (sc) sc.scrollTop += sc.scrollHeight - h0; // garde la position de lecture
    } else {
      const add = list.filter((d) => parseISO(d.stop.departure) > edge);
      if (!add.length) toast('Pas de départ plus tard trouvé.');
      S.boardAfter = (S.boardAfter || []).concat(add);
      drawBoard();
    }

  const time = S.boardTime || (S.boardDate ? '05:00' : hm(new Date()));
  q += `&datetime=${encodeURIComponent(date + ' ' + time)}`;

function drawBoard() {
  const f = S.stop, active = filters[f.id] || [];
  if (!$('#deps')) return;
  if (sheet.classList.contains('open') && $('#sheetBody').querySelector('[data-sheet="lineAll"]')) $('#sheetBody').innerHTML = linesSheetHtml();
  const now = Date.now(), live = boardLive();
  const extra = (S.boardBefore && S.boardBefore.length) || (S.boardAfter && S.boardAfter.length);
  // Tri dans l'ordre réel de passage (retards et avances compris), puis par heure prévue
  const realOf = (d) => {
    const p = parseISO(d.stop.departure);
    const prog = parseISO(d.stop.prognosis && d.stop.prognosis.departure);
    return (prog || new Date(p.getTime() + (d.stop.delay || 0) * 60000)).getTime();
  };
  const filtered = boardAll().filter((d) => !active.length || active.includes(String(d.number || d.category)))
    .sort((a, b) => realOf(a) - realOf(b) || parseISO(a.stop.departure) - parseISO(b.stop.departure));
  S.boardRows = extra ? filtered : filtered.slice(0, 30);
  const rows = S.boardRows.map((d, i) => {
    const planned = parseISO(d.stop.departure);
    const delay = d.stop.delay || 0;
    const prog = parseISO(d.stop.prognosis && d.stop.prognosis.departure);
    const real = prog || new Date(planned.getTime() + delay * 60000);
    const diff = Math.round((real - now) / 60000);
    const past = real.getTime() < now - 30000;
    const sameDay = ymd(planned) === todayStr();
    const pref = sameDay ? '' : planned.getDate() + '.' + (planned.getMonth() + 1) + '. ';
    const delta = Math.round((real - planned) / 60000);
    const dcls = delta > 0 ? 'st-late' : 'st-early';
    const mode = depMode();
    let big, sub = '';
    if (mode === 'time') {
      big = pref + hm(planned);
      if (delta) sub = `<span class="${dcls}">${fmtDelta(delta)} · ${hm(real)}</span>`;
    } else if (!past && live && diff <= 59) {
      big = diff <= 0 ? 'Imm.' : diff + ' min'; // retard ou avance déjà compris
    } else {
      big = pref + hm(real);
      if (delta) sub = `<span class="${dcls}">${fmtDelta(delta)} min</span>`;
    }
    return `<button class="dep" data-act="openJourney" data-i="${i}"${past ? ' style="opacity:.5"' : ''}>${badge(d.category, d.number)}
      <div class="dep-to"><span class="to-line"><span class="to">${esc(short(d.to))}</span>${past ? '' : bellHtml(bellKey(S.stop.id, d), i)}</span>
        ${mode === 'time' ? (d.stop.platform ? `<span class="small">Quai ${esc(d.stop.platform)}</span>` : '') : `<span class="small">Prévu ${hm(planned)}${d.stop.platform ? ' · quai ' + esc(d.stop.platform) : ''}</span>`}
        ${warnHtml(alertsFor([d.number], [S.stop.id, ...(d.passList || []).map((p) => p.station && p.station.id)], real, d.to))}</div>
      <div class="dep-r"><span class="big">${big}</span>${sub}</div></button>`;
  }).join('');
  $('#deps').innerHTML = rows || '<p class="empty">Aucun départ pour ce filtre.</p>';
  $('#upd').textContent = live ? 'Temps réel · mis à jour à ' + hm(new Date()) : 'Horaire du ' + dateLabel(S.boardDate);
}

/* ---------- PARCOURS D'UNE COURSE ---------- */
// Ajuste la taille du titre pour tenir sur 2 lignes max, dans la hauteur du badge de ligne
function fitTitle(el) {
  if (!el) return;
  const b = el.parentElement.querySelector('.badge');
  const maxH = Math.max(30, b ? b.offsetHeight : 30) + 2;
  for (let size = 20; size >= 11; size--) {
    el.style.fontSize = size + 'px';
    if (el.scrollHeight <= maxH) return;
  }
}
/* Parcours types (data/patterns.json, horaire officiel) : arrêts avant celui où l'on est */
let PATTERNS = null, patternsP = null;
function loadPatterns() {
  if (!patternsP) {
    patternsP = fetch('data/patterns.json').then((r) => (r.ok ? r.json() : null))
      .then((j) => (PATTERNS = (j && j.lines) || {})).catch(() => (PATTERNS = {}));
  }
  return patternsP;
}
const stopById = (id) => (STOPS ? STOPS.find((x) => x.id === String(id)) : null);
function previousStops(line, ids) {
  const cands = PATTERNS && PATTERNS[String(line || '').trim().toUpperCase()];
  if (!cands || !ids.length) return null;
  let best = null;
  for (const p of cands) {
    const idx = p.s.indexOf(ids[0]);
    if (idx < 0) continue;
    let k = idx, m = 0;
    for (const id of ids.slice(1)) { const j = p.s.indexOf(id, k + 1); if (j >= 0) { m++; k = j; } }
    const score = m * 100000 + p.n;
    if (!best || score > best.score) best = { score, p, idx, m };
  }
  if (!best || (ids.length > 2 && best.m < (ids.length - 1) * 0.7)) return null;
  return { ids: best.p.s.slice(0, best.idx), off: best.p.o.slice(0, best.idx), curOff: best.p.o[best.idx] };
}
// Arrêts non desservis / déplacés d'après les perturbations
function stopIssueFinder(alerts) {
  const sets = { skip: new Set(), moved: new Set() };
  for (const a of alerts) for (const sl of a.stopLists || []) {
    const kind = /d[ée]plac/i.test(sl.kind) ? 'moved' : 'skip';
    for (const raw of sl.names || []) {
      const parts = raw.split(/\s*,\s*/).map(fold).filter(Boolean);
      parts.forEach((x, i) => { sets[kind].add(x); if (parts[i + 1]) sets[kind].add(x + ' ' + parts[i + 1]); });
    }
  }
  return (name) => {
    const full = fold(name), local = fold(name.includes(',') ? name.slice(name.indexOf(',') + 1) : name);
    for (const kind of ['skip', 'moved']) if (sets[kind].has(full) || sets[kind].has(local)) return kind;
    return null;
  };
}
function legTime(r, live, now) {
  if (!r.t) return '';
  const real = r.real || r.t;
  const delta = Math.round((real - r.t) / 60000);
  const dcls = delta > 0 ? 'd' : 'd early';
  if (depMode() === 'time') return hm(r.t) + (delta ? `<span class="${dcls}">${fmtDelta(delta)} · ${hm(real)}</span>` : '');
  const diff = Math.round((real - now) / 60000);
  if (live && !r.past && diff >= 0 && diff <= 59) return diff === 0 ? 'Imm.' : diff + ' min';
  return hm(real) + (delta ? `<span class="${dcls}">${fmtDelta(delta)}′</span>` : '');
}
function renderJourney() {
  const d = S.journey; if (!d) return go('board', false);
  const st = lineStyle(d.category, d.number);
  const list = d.passList && d.passList.length ? d.passList : [];
  const now = Date.now(), live = boardLive();
  if (PATTERNS === null || STOPS === null) Promise.all([loadPatterns(), dataReady]).then(() => { if (S.screen === 'journey' && S.journey === d) renderJourney(); });

  const t0 = parseISO(d.stop.departure) || new Date();
  // Le premier élément de passList porte un identifiant erroné dans l'API : on prend celui de l'arrêt affiché
  const ids = list.map((p, i) => (i === 0 ? String(S.stop.id) : String((p.station && p.station.id) || '').split(':')[0]));
  const alerts = alertsFor([d.number], [S.stop.id, ...ids], t0, d.to);
  const issue = stopIssueFinder(alerts);

  // Arrêts déjà desservis avant l'arrêt où l'on est (horaire officiel + retard actuel)
  const prev = list.length ? previousStops(d.number, ids) : null;
  const curDelay = d.stop.delay || 0;
  const rowsData = [];
  if (prev) prev.ids.forEach((id, i) => {
    const t = new Date(t0.getTime() - (prev.curOff - prev.off[i]) * 60000);
    const real = new Date(t.getTime() + curDelay * 60000);
    const s = stopById(id);
    rowsData.push({ id, name: s ? s.name : '', t, real, past: live && real.getTime() < now - 30000, before: true });
  });
  list.forEach((p, i) => {
    const t = parseISO(p.departure || p.arrival);
    const progT = parseISO(p.prognosis && (p.prognosis.departure || p.prognosis.arrival));
    const delay = p.delay || (t && progT ? Math.round((progT - t) / 60000) : 0);
    const real = progT || (t ? new Date(t.getTime() + (delay || 0) * 60000) : null);
    rowsData.push({
      id: ids[i], name: (p.station && p.station.name) || (i === 0 ? S.stop.name : ''), t, real, platform: p.platform,
      past: live && i > 0 && real && real.getTime() < now - 30000, here: i === 0
    });
  });
  const rows = rowsData.map((r, i) => {
    const iss = issue(r.name);
    const cls = ['jrow', i === 0 ? 'first' : '', r.here ? 'here' : '', i === rowsData.length - 1 ? 'last' : '', r.past ? 'past' : '', iss ? 'iss-' + iss : ''].join(' ');
    const tag = iss === 'skip' ? '<span class="stop-tag skip">Non desservi</span>' : iss === 'moved' ? '<span class="stop-tag moved">Déplacé</span>' : '';
    const inner = `<div class="leg-t">${legTime(r, live, now)}</div>
      <div class="rail"><span class="node"${r.here ? ' style="background:var(--c)"' : ''}></span></div>
      <div class="stn"><span class="stn-name">${esc(short(r.name))}</span>${r.platform ? ` <span class="small">· quai ${esc(r.platform)}</span>` : ''}${r.here ? ' <span class="small">· tu es ici</span>' : ''}${tag}</div>`;
    return r.id && !r.here
      ? `<button class="${cls}" data-act="openStopFromJourney" data-id="${esc(r.id)}" data-name="${esc(r.name)}">${inner}</button>`
      : `<div class="${cls}">${inner}</div>`;
  }).join('');

  main.innerHTML = `
    <header class="top back">${backBtn()}
      <div class="row gap" style="min-width:0;flex:1">${badge(d.category, d.number)}<h1 class="j-title" id="jTitle" style="font-size:20px">${esc(short(d.to))}</h1></div>
      ${(parseISO(d.stop.departure) || 0) > Date.now() - 60000 ? `<button class="icon-btn bell ${hasBell(bellKey(S.stop.id, d)) ? 'on' : ''}" style="width:44px;height:44px;margin:0" data-act="bellJourney" aria-label="Suivre ce départ">${BELL(hasBell(bellKey(S.stop.id, d)))}</button>` : ''}
    </header>
    <div class="scroll stack">
      ${alerts.map((a) => `<button class="alert-banner" data-act="alertOne" data-id="${esc(a.id)}"><span style="color:var(--bad);margin-top:1px">${WARN_ICON.replace(/13/g, '18')}</span>
          <span class="stack" style="gap:2px"><span class="a-tag">Attention${causeLabel(a) ? ' · ' + esc(causeLabel(a)) : ''}</span><span class="a-title">${esc(a.title || 'Perturbation')}</span></span></button>`).join('')}
      <p class="small" style="margin:0 4px">${prev ? 'Parcours complet · ' + rowsData.length + ' arrêts' : 'Depuis ' + esc(short(S.stop.name)) + (list.length ? ' · ' + list.length + ' arrêts' : '')}${d.operator ? ' · ' + esc(d.operator) : ''}</p>
      ${list.length
        ? `<div class="card" style="padding:6px 0;--c:${st.bg}">${rows}</div><p class="foot">Arrêts grisés : déjà desservis. Touche un arrêt pour voir ses départs.</p>`
        : '<div class="card empty-card">Le parcours de cette course n’est pas disponible.</div>'}
    </div>`;
  fitTitle($('#jTitle'));
  if (prev && prev.ids.length) {
    const h = main.querySelector('.jrow.here');
    if (h) h.scrollIntoView({ block: 'center' });
  }
}

/* ---------- tirer pour actualiser ---------- */
async function refreshScreen() {
  const clearStatus = () => Object.keys(statusCache).forEach((k) => delete statusCache[k]);
  switch (S.screen) {
    case 'board': await loadBoard(); break;
    case 'journey': {
      await loadBoard();
      const o = S.journey;
      const m = S.board.find((d) => d.stop.departure === o.stop.departure && d.number === o.number && d.to === o.to);
      if (m) S.journey = m;
      if (S.screen === 'journey') renderJourney();
      break;
    }
    case 'results': S.res = []; await loadResults(S.q.time, 'replace'); break;
    case 'commutes': clearStatus(); renderCommutes(); await new Promise((r) => setTimeout(r, 700)); break;
    case 'home': clearStatus(); await fillNext(); break;
    case 'infos': await loadAlerts(true); break;
    case 'map': if (M.walkStop) await walkToStop(); else await mapPlan(true); break;
    default: await new Promise((r) => setTimeout(r, 300));
  }
}
(function pullToRefresh() {
  const app = $('#app');
  const ptr = document.createElement('div');
  ptr.id = 'ptr';
  ptr.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>';
  app.appendChild(ptr);
  const TH = 80, MAX = 130; // distance à atteindre (px) avant de relâcher
  let startY = null, dy = 0, sc = null, busy = false, armed = false;
  const topOf = (el) => el.getBoundingClientRect().top - app.getBoundingClientRect().top;
  function reset(anim) {
    ptr.style.transition = anim ? 'opacity .2s, transform .2s' : 'none';
    ptr.style.opacity = 0;
    if (sc) { sc.style.transition = anim ? 'transform .25s' : 'none'; sc.style.transform = ''; }
    dy = 0; armed = false;
  }
  main.addEventListener('touchstart', (e) => {
    if (busy || e.touches.length !== 1 || sheet.classList.contains('open')) return;
    sc = e.target.closest('.scroll');
    if (!sc || sc.scrollTop > 0) { sc = null; return; }
    startY = e.touches[0].clientY; dy = 0; armed = false;
  }, { passive: true });
  main.addEventListener('touchmove', (e) => {
    if (startY == null || !sc) return;
    const raw = e.touches[0].clientY - startY;
    if (raw <= 0 || sc.scrollTop > 0) { if (dy) reset(false); return; }
    e.preventDefault();
    dy = Math.min(MAX, raw * 0.5);
    const p = Math.min(1, dy / TH);
    ptr.style.transition = 'none';
    ptr.style.opacity = p;
    ptr.style.transform = `translateY(${topOf(sc) - 44 + dy}px) rotate(${p * 300}deg)`;
    ptr.style.color = dy >= TH ? 'var(--accent)' : 'var(--faint)';
    sc.style.transition = 'none';
    sc.style.transform = `translateY(${dy * 0.6}px)`;
    const now = dy >= TH;
    if (now && !armed && navigator.vibrate) navigator.vibrate(8);
    armed = now;
  }, { passive: false });
  const end = async () => {
    if (startY == null) return;
    startY = null;
    if (!sc) return;
    if (armed && !busy) {
      busy = true;
      ptr.style.transition = 'transform .2s';
      ptr.style.transform = `translateY(${topOf(sc) + 10}px)`;
      ptr.classList.add('spin');
      sc.style.transition = 'transform .2s';
      sc.style.transform = 'translateY(64px)';
      try { await refreshScreen(); } catch {}
      await new Promise((r) => setTimeout(r, 250));
      ptr.classList.remove('spin');
      busy = false;
    }
    reset(true);
  };
  main.addEventListener('touchend', end);
  main.addEventListener('touchcancel', end);
})();

function renderTrip() {
  const c = S.trip; if (!c) return go('results', false);
  const secs = c.raw.sections || [];
  const parts = secs.map((s) => {
    const dep = parseISO(s.departure && s.departure.departure);
    const arr = parseISO(s.arrival && s.arrival.arrival);
    const fromName = s.departure && s.departure.station ? s.departure.station.name : '';
    const toName = s.arrival && s.arrival.station ? s.arrival.station.name : '';
    if (!s.journey) {
      let mins = dep && arr ? Math.round((arr - dep) / 60000) : 0;
      if (!mins && s.walk && s.walk.duration) {
        const w = String(s.walk.duration);
        const secs = w.includes(':') ? w.split(':').reduce((a, b) => a * 60 + Number(b), 0) : Number(w);

    }
    const j = s.journey, st = lineStyle(j.category, j.number);

        <div class="leg-b"><div class="stn">${esc(short(fromName))}</div><div class="meta">Départ${plat(s.departure)}</div></div>
      </div>
      <div class="leg" style="--c:${st.bg}">

          <div class="mid">${badge(j.category, j.number, true)}<span style="font-weight:800">direction ${esc(short(j.to))}</span></div>
          ${warnHtml(alertsFor([j.number], (j.passList || []).map((p) => p.station && p.station.id), dep || new Date(), j.to))}
          ${pass.length ? `<details class="pass"><summary>${pass.length} arrêt${pass.length > 1 ? 's' : ''} intermédiaire${pass.length > 1 ? 's' : ''}</summary>
            <ol>${pass.map((p) => { const t = parseISO(p.departure || p.arrival); return `<li><span>${t ? hm(t) : ''}</span><span>${esc(short(p.station && p.station.name))}</span></li>`; }).join('')}</ol></details>` : ''}

  // Depuis la carte : marche depuis ta position jusqu'au premier arrêt, et jusqu'à l'adresse à la fin

  const after = W && W.endWalkSec ? walkLeg(Math.max(1, Math.round(W.endWalkSec / 60)), '') + placeLeg(hm(new Date(c.arr.getTime() + W.endWalkSec * 1000)), W.endLabel, 'Arrivée') : '';
  const startT = W ? hm(W.leave) : c.depStr;
  const endT = W && W.endWalkSec ? hm(new Date(c.arr.getTime() + W.endWalkSec * 1000)) : c.arrStr;
