name: Debug (temporaire)
on:
  push:
    branches: [main]
    paths: [.github/debug/request.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o /tmp/g.zip "$(head -1 .github/debug/request.txt)"
          unzip -l /tmp/g.zip > .github/debug/out.txt
          unzip -p /tmp/g.zip stops.txt | head -3 >> .github/debug/out.txt
          unzip -p /tmp/g.zip stops.txt | grep -i "Jean-Jacques" | head -10 >> .github/debug/out.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/debug && git commit -m "debug: réponse" && git pull --rebase origin main && git push origin HEAD:main || true
