name: Debug (temporaire)
on:
  push:
    branches: [main]
    paths: [.github/debug/request.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TZ=Europe/Zurich date > .github/debug/out.txt
          i=0
          while read -r url; do i=$((i+1)); curl -sSL "$url" -o ".github/debug/out$i.json"; done < .github/debug/request.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/debug && git commit -m "debug: réponse" && git pull --rebase origin main && git push origin HEAD:main || true
