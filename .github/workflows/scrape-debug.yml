name: Debug info-trafic tpg
on:
  push:
    branches: [debug-tpg]
    paths: [.github/workflows/scrape-debug.yml]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les données info-trafic
        run: |
          mkdir -p dbg
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36"
          curl -sSL -A "$UA" -H "X-Requested-With: XMLHttpRequest" -D dbg/h1.txt -o dbg/getInfoTrafic.json https://www.tpg.ch/fr/getInfoTrafic || true
          curl -sSL -A "$UA" -H "X-Requested-With: XMLHttpRequest" -D dbg/h2.txt -o dbg/getInfoTrafficHtml.out https://www.tpg.ch/fr/getInfoTrafficHtml || true
          wc -c dbg/getInfo* > dbg/status3.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbg && git commit -m "debug" && git push origin HEAD:debug-tpg || true
