name: Debug info-trafic tpg
on:
  push:
    branches: [debug-tpg]
    paths: [.github/workflows/scrape-debug.yml]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les scripts info-trafic
        run: |
          mkdir -p dbg
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36"
          curl -sSL -A "$UA" -o dbg/info-trafic.js https://www.tpg.ch/modules/custom/info_trafic/dist/js/info-trafic.js?v=1.1 || true
          curl -sSL -A "$UA" -o dbg/paragraph-info-trafic.js "https://www.tpg.ch/themes/custom/tpg/dist/js/paragraph-info-trafic.js" || true
          wc -c dbg/*.js > dbg/status2.txt
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbg && git commit -m "debug" && git push origin HEAD:debug-tpg || true
