name: Mise à jour des tracés (Atlas RCT)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-shapes.mjs
      - .github/workflows/update-shapes.yml
  schedule:
    - cron: '23 3 * * *' # chaque nuit

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copier les tracés depuis Atlas
        env:
          ATLAS_PROJECT: atlas-rct
          ATLAS_API_KEY: AIzaSyDAIF0eVYFtHdIi4iXcSyYq10SRPVnkWHI # clé web publique d'Atlas
        run: node scripts/build-shapes.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shapes.json
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour automatique des tracés"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
