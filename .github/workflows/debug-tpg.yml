name: debug-tpg
on: [push]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://www.tpg.ch/fr/getInfoTrafic
          for ua in "Mozilla/5.0 (compatible; NotTPG/1.0)" "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"; do
            echo "== UA: $ua"; curl -s -m 20 -o /tmp/o -D /tmp/h -w "code=%{http_code}\n" -H "User-Agent: $ua" -H "X-Requested-With: XMLHttpRequest" -H "Accept: application/json" "$U"; grep -i "^server\|^cf-\|^x-" /tmp/h | head -5; head -c 200 /tmp/o; echo; done
          echo "== page"; curl -s -m 20 -o /dev/null -w "code=%{http_code}\n" https://www.tpg.ch/fr/voyager/info-trafic/info-trafic
