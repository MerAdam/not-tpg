name: Mise à jour des données (arrêts et couleurs tpg)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-data.mjs
      - .github/workflows/update-data.yml
  schedule:
    - cron: '17 3 1 * *'   # le 1er de chaque mois
    - cron: '17 3 14 12 *' # juste après le changement d'horaire de décembre

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les données
        run: node scripts/build-data.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour automatique des données tpg"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
